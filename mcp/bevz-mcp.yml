integrator_service_mcp:
  exists: false
  note: >-
    No MCP server for the Bevz Integrator Service API was found. api.bevz.com and
    sandbox-api.bevz.com return 403 at the AWS API Gateway edge for every path probed, and no MCP
    endpoint is referenced in the docs, the spec, or any registry. See mcp/bevz-tool-crosswalk.yml
    for the candidate tool surface the OpenAPI would support if Bevz chose to ship one.
