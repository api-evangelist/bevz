field_conventions:
  case: lowerCamelCase for most objects (storeId, orderProducts, deliverySettings)
  exceptions: >-
    snake_case appears in the Menu and IntegratorUser schemas (store_id, file_path, error_file,
    time_completed, integrator_id, created_at) and in query parameters (next_page, date_field), and
    integrator_id / store_id / order_id / product_id / menu_id are snake_case as PATH parameters
    while the same ids are camelCase in bodies. Casing is not uniform across the contract.
  timestamps: ISO 8601 UTC strings (e.g. 2024-06-24T01:56:49.901Z)
  money: Numeric prices; no currency field is published (USD is implied by the US-only footprint).
expansion:
