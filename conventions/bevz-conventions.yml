  protocol: https
  style: REST
  media_type: application/json
  additional_request_media_types: [text/csv]
  csv_note: Menu upload (postMenu) accepts a CSV payload as well as JSON, with configurable column-name mapping.
authentication:
  style: bearer-jwt
  header: 'Authorization: Bearer <token>'
  detail: authentication/bevz-authentication.yml
idempotency:
  supported: false
  header: null
  evidence: >-
    No idempotency key, request-id replay key, or safe-retry semantics appear anywhere in the 129
    published spec files or the docs prose (grep for "idempot" returns zero hits across the whole
    published contract).
  consequence: >-
    createStore, postStore, postMenu, testStoreOrders and postOrderAdjustment are all non-idempotent
    POSTs with no dedupe key, so a retried request after a timeout can double-create. postMenu
    partially self-guards by rejecting a concurrent upload with "An ongoing upload for this storeId
    is still in progress", but that is a lock, not idempotency.
pagination:
  style: cursor-token
  parameters:
    - {name: limit, in: query, description: Maximum records to return.}
    - {name: next_page, in: query, description: Opaque token returned by the previous response; omit for the first page.}
  response_fields:
    - {name: next_page, description: Token for the next page. Absent or empty when the result set is exhausted.}
    - {name: data, description: The array of records for this page.}
  applies_to: [getProducts, getStoreOrders, getLottoScratcherGames]
  inconsistency: >-
    getStores returns a bare JSON ARRAY with no envelope and no pagination at all, while getProducts
    and getStoreOrders return a {next_page, data} object. Two collection shapes coexist in one API.
  default_page_size_published: false
  total_count_published: false
response_envelope:
  consistent: false
  documented_shape:
    fields: [api_version, status_code, message, errors, data]
    source: https://docs.bevz.com/#tag/Getting-Started
  reality: >-
    The five-field envelope is shown in the docs quickstart (the login response) and is the shape
    error bodies broadly follow, but the spec's own 200 schemas do NOT declare it uniformly — some
    return a bare array (getStores), some return {next_page, data} (getProducts), some return
    {message} only. An agent cannot rely on one success shape.
  version_echo: api_version is echoed in the body (e.g. "v1.11.3"), which is the only runtime version signal Bevz emits.
