remediation:
  '401': 'JWT missing, expired or invalid. Re-authenticate at POST {baseUrl}/integrators/login and send Authorization: Bearer <token>. Tokens expire after 30 days.'
  '403': API Gateway authorizer denied the request (explicit deny) — the integrator identity is not entitled to this resource.
  '400': Field-level validation failure. The message names the offending field using Joi-style validation text; correct the payload and retry.
  '404': The addressed integrator, store, menu, order or user does not exist under this integrator.
  '500': Report to tech@bevz.com per the published FAQ.
