      **Store Settings Updated Event**
      ```json
      {
        "event": "store_settings_updated",
        "bevzStoreId": "831fd907-b455-4e92-828b-2e5421d057d7",
        "data": {
          "hours": [
            {
              "type": "DAILY_HOURS",
              "days": [1, 2, 3, 4, 5, 6, 7],
              "openTime": "09:00 AM",
              "closeTime": "10:00 PM"
            }
          ]
        }
      }
      ```

      ## How to Set Up Webhooks

      1. **Create Your Webhook Endpoint:**  
         Set up a URL on your server to receive POST requests from Bevz. Your endpoint should accept JSON payloads and handle authentication if needed.

      2. **Register Your Webhook with Bevz:**
         Use the following endpoints to register your webhook URLs:
         - [Setup Order Notification Webhook](#tag/Integrators/operation/patchOrder)
         - [Setup Menu Upload Notification](#tag/Integrators/operation/patchMenuUpload)
         - **Setup Store Status Webhook:** To enable store status notifications for your integration, please contact your Bevz POS integration manager.

      3. **(Optional) Secure Your Webhook:**  
         For added security, you can require a shared secret or token in the request headers or body. Contact your POS integration manager to enable this feature.

      4. **Receive and Process Events:**  
         When an event occurs, Bevz will send a POST request to your webhook URL with a JSON payload describing the event. Your system should process this data and take any necessary actions (e.g., update your database, notify staff, etc.).

      ## Best Practices

      - Always verify the authenticity of incoming webhook requests.
      - Respond with a `200 OK` status to acknowledge receipt.
      - Log webhook events for troubleshooting and auditing.
      - Handle retries gracefully—Bevz may resend events if your endpoint does not respond successfully.
  
  - name: Uploading store menu
    description: |
      ## Uploading Your Store Menu

      Bevz supports two convenient ways to upload your store's menu:

      - **CSV File Upload**
      - **JSON Payload in the Request Body**

      For both formats, the following fields are **required**: `upc`, `name`, and `price`.

      ### How It Works

      - When you upload a menu, Bevz matches each UPC with products in our database. If a match is found, the product is enabled for your store.
      - If any products do not match, you’ll receive a downloadable error file listing those items.

      ### Sample CSV Upload

      | upc           | name                       | price | description | stock | quantity | size         | imageurl                                                        |
      |---------------|----------------------------|-------|-------------|-------|----------|--------------|-----------------------------------------------------------------|
      | 00980012301   | FERRERO ROCHER             | 1.99  | Chocolate   | 10    | single   | 12 piece box | https://bevz-media.s3-us-west-1.amazonaws.com/example.png       |
      | 00980080005   | NUTELLA                    | 1.0  | Chocolate spread | 10 | single | 350g | https://bevz-media.s3-us-west-1.amazonaws.com/example.png
      | ...           | ...                        | ...   | ...         | ...   | ...      | ...          | ...                                                             |

      ### Sample JSON Upload

      ```json
      {
        "menu": [
          {
            "name": "Ben & Jerry's the Tonight Dough (16 oz)",
            "upc": "76840485116",
            "description": "Ben and Jerry's The Tonight Dough Caramel & Chocolate Ice Cream",
            "price": "8.90",
            "stock": "10",
            "size": "1 Pint",
            "quantity": "Single",
            "imageurl": "https://bevz-media.s3-us-west-1.amazonaws.com/example.png"
          }
        ]
      }
      ```

      ### Checking Upload Status

      - Use [Retrieve the menu upload status](#tag/Stores/operation/getMenu) to check the status of your upload, download the error file, and see which products were successfully enabled.
      - You can also receive real-time updates by configuring a [Menu Upload Webhook](#tag/Webhooks/operation/menuUploadWebhook).


      > **⚠️ IMPORTANT**  
      > - Ensure all required fields are present and valid.
      > - Use the error file to quickly identify and correct any issues with your menu data.
      > - For large menus, consider breaking uploads into smaller batches for easier troubleshooting.

      ## Error file
      The error file is a CSV that lists products from your upload that did not match any existing items in the Bevz database. Use this file to review and correct any discrepancies.

      #### Sample Error File

      | quantity | size   | price | name                | upc        | description      | stock | merchantSuppliedId | reason                                      |
      |----------|--------|-------|---------------------|------------|------------------|-------|--------------------|----------------------------------------------|
      | 1        | 1 item | 0.75  | SVC                 | svc1       | -SVC 1.00        | 8     | svc1               | INVALID_UPC                                 |
      | 1        | 1 item | 3.49  | SNAK CLUB           | 8707621641 | NON-TAXABLE      | 4     | 8707621641         | UPC_NOT_FOUND                                |
      | 1        | 1 item | -5.99 | SC LM CASHEWS 4.50Z | 8707641135 | NOTX - SNACKS    | 3     | 8707641135         | Invalid amount value, must be numbers only   |
      | 1        | 1 item | 2.99  |                     | 8707641136 | NOTX - SNACKS    | 2     | 8707641136         | Invalid name format                          |
      | 1        | 1 item | 3.99  | SC LM CASHEWS 4.50Z | 8707641137 | NOTX - SNACKS    | -5    | 8707641137         | Invalid stock count value, must be numbers only |

      #### Error Reason Explanations

      | Reason                                          | Explanation                                                                                   |
      |-------------------------------------------------|-----------------------------------------------------------------------------------------------|
      | INVALID_UPC                                     | The provided UPC is not in a valid format or contains invalid characters.                     |
      | UPC_NOT_FOUND                                   | The UPC does not match any product in the Bevz database.                                      |
      | Invalid amount value, must be numbers only      | The price field contains a non-numeric value or a negative number, which is not allowed.      |
      | Invalid name format                             | The product name is missing or contains invalid characters.                                   |
      | Invalid stock count value, must be numbers only | The stock field contains a non-numeric value or a negative number, which is not allowed.      |

      
  - name: Receiving and processing order
    description: |
      ## Receiving Orders

      Bevz makes it easy to receive and process orders in real time using webhooks and our order management API.

      ### 1. Receive Order Notifications

      - Register your webhook endpoint using [Setup Order Notification Webhook](#tag/Integrators/operation/patchOrder).
      - When a new order is placed or its status changes, Bevz will send a POST request to your webhook with all relevant order details.

      ### 2. Accepting or Updating Orders

      - Use [Patch Order Status](#tag/Order/operation/patchOrderStatus) to accept, update, or cancel orders.
      - Update your internal systems and trigger any necessary notifications or workflows.

      ### 3. Completing Orders

      - When an order is fulfilled and handed over to the delivery service or courier, update its status using [Patch Order Status](#tag/Order/operation/patchOrderStatus).
      - This will trigger notifications and update your records accordingly.

      ### 4. Testing Orders

      - Use [Test Order Status](#tag/Order/operation/testStoreOrders) to simulate order flows and ensure your integration is working as expected.
      - This endpoint allows you to finalize test orders, process payments, and verify that notifications and webhooks are triggered correctly.

      ## Best Practices

      - Always acknowledge webhook events with a `200 OK` response.
      - Validate and log all incoming order data.
      - Handle order status changes promptly to ensure a smooth customer experience.
      - Use the test endpoints to verify your integration before going live.

      For more details, see the [Order API documentation](#tag/Order).

