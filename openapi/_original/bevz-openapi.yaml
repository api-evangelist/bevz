      **Menu Upload Failed Event**
      ```json
      {
        "id": 1,
        "store_id": "6e066cfe-9122-4c30-a7fc-a8894dd72f4h",
        "file_path": "https://integrator-menu-569241935122.s3.us-west-1.amazonaws.com/raw/a990fb29-3ea7-4e59-b293-a20574807927_b8c49890-67e5-42b8-aaaa-855ffbe92511.csv",
        "status": "failed",
        "error_file": "https://integrator-menu-569241935122.s3.us-west-1.amazonaws.com/error/a990fb29-3ea7-4e59-b293-a20574807927_b8c49890-67e5-42b8-aaaa-855ffbe92511_error-file.csv",
        "date": "2023-03-09T04:18:57.658Z",
        "time_completed": ""
