  # How do I sign up for an Integrator account?
    To get started with your Bevz integration, please email your request to [support@bevz.com](mailto:support@bevz.com).
    An Integrator Account Manager will guide you through the onboarding process.

  # Common HTTP Error Codes
    Bevz follows standard HTTP status codes to indicate the outcome of API requests:

    `200 OK`
    > The request was successful.

    `201 Created`
    > The request was successful and resulted in the creation of a new resource.

    `204 No Content`
    > The request was successful, but there is no content to return.

    `400 Bad Request`
    > The server could not process the request due to client-side input errors.
      Please review the API response message for more details.

    `401 Unauthorized`
    > The request lacks valid authentication credentials.

    `403 Forbidden`
    > The server understands the request but refuses to authorize it.

    `404 Not Found`
    > The requested resource could not be found.

    `500 Internal Server Error`
    > The server encountered an unexpected condition that prevented it from fulfilling the request.
      If you encounter this error, please contact [tech@bevz.com](mailto:tech@bevz.com) for assistance.

  # Can other integrators see my data?
    No. Your data is secured, protected, and accessible only by your organization.
    Bevz applies multiple security checks and validations to safeguard our partners’ data.

