description: Integrator store successfully provisioned
content:
  application/json:
    schema:
      type: object
      properties:
        message:
          type: string
          example: Integrator store successfully provisioned
        data: 
          type: object
          properties:
            storeId:
              type: string
              example: "47431637-f45d-42da-a364-428b33023c9b"
            address:
              type: object
              properties:
                street1:
                  type: string
                  example: "123123 10th St"
                state:
                  type: string
                  example: CA
                city:
                  type: string
                  example: Santa Monica
                zipCode:
                  type: string
                  example: "90401"
            email:
              type: string
              example: test_integrator@bevz.com
            setup:
              type: boolean
              example: true
            name:
              type: string
              example: Bevz Test Store
            hours:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: ""
                  days:
                    type: array
                    example:
                      - 1
                      - 2
                  openTime:
                    type: string
                    example: "03:30 AM"
                  closeTime:
                    type: string
                    example: "02:00 PM"
            phone:
              type: string
              example: "7852630348"
            phones:
              type: array
            taxRate:
              type: string
              example: "6%"
            updatedAt:
              type: string
              example: "2023-03-09T04:18:57.658Z"

