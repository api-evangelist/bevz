post:
  tags:
    - integrator_users
  operationId: changePassword
  summary: Change Integrator User Password
  description: |
    Change the password for a specific integrator user account.

    Use this endpoint to securely update a user's password.  
    The user must provide their current password (`old_password`) and a new password (`new_password`).  
    This is useful for routine password changes or when a user suspects their credentials have been compromised.

  parameters:
    - name: integrator_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Unique identifier for the integrator.
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Unique identifier for the user.
    - name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: |
        JWT token for authenticating API requests.  
      example: Bearer yourJWTtoken

  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - old_password
            - new_password
          properties:
            old_password:
              type: string
              description: The user's current password.
              example: currentPassword123
            new_password:
              type: string
              description: The new password to set for the user account.
              example: newSecurePassword456

  responses:
    "200":
      $ref: "../responses/users-userid-changepassword/post/200.yaml"
    "400":
      $ref: "../responses/users-userid-changepassword/post/400.yaml"
    "401":
      $ref: "../responses/shared/401.yaml"
    "403":
      $ref: "../responses/shared/403.yaml"
