  # Authentication

  To access API endpoints, include an API key in the request header.  
  Obtain your API key by generating a JWT token using your POS integrator user credentials.

  JWT is used as an access token to protect your store resources and prevent unauthorized access.  
  Learn more about JWT here: [JWT.io](https://jwt.io)

  > **⚠️ Common Errors**  
  > 
  > - **401 Unauthorized:**  
  >   - Your JWT token is missing, expired, or invalid.  
  >   - Ensure you include the header: `Authorization: Bearer yourJWTtoken` in every request.  
  >   - If your token is older than 30 days, log in again to obtain a new one.

  ## Generating a JWT Token

  1. Use your email and password to log in via POST `{BaseUrl}/integrators/login`
      
      **Sample Request Body:**
      ```json
      {
        "email": "sample_email@bevz.com",
        "password": "sample_password"
      }
      ```

      **Sample Response:**
      ```json
      {
        "api_version": "v1.11.3",
        "status_code": 200,
        "message": "Login successful",
        "errors": [],
        "data": {
          "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjdhYjIwNGJiLTRhOGEtNGMwMS1iNDUwLTAzZjgzYmY1ZTk0NCIsImVtYWlsIjoiaGFubmFoQGJldnouY29tIiwiY2xpZW50IjoiSU5URUdSQVRPUiIsInNjb3BlIjoiKiIsInN1YiI6IjEiLCJleHAiOjE3NjA2MjUxNjEuODM0LCJpYXQiOjE3NTgwMzMxNjEuODcyLCJhdWQiOiJCZXZ6In0.32MxKENvgTWif58cRUaHIoHg2nGO8z1tP11PwHoM1"
        }
      }
      ```

      *Note: The token expires every 30 days. To generate a new token, simply log in again.*
