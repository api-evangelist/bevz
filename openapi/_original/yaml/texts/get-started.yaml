  # Going Live

  After completing your integration build, prototyping, and testing phases, you’ll participate in a collaborative testing process.  
  This involves executing a predefined set of test cases to validate your integration and ensure it meets all functional requirements.  
  Upon successful completion, Bevz will grant sign-off, provide production credentials, and initiate the Pilot phase.

  To support effective communication and feedback, a collaborative Q&A session will be scheduled for live discussions between your team and Bevz.

  ## Procedural Breakdown

  The following sections outline the specific procedures to follow:

  ### 1. Menu
  - Upload your menu

  ### 2. Order Submission and Validation
  - Create a test order
  - Receive order notifications
  - Accept a test order
  - Cancel a test order
  - Mark a test order as out for delivery
  - Complete a test order

  ### 3. Item Modifiers and Availability
  - Update pricing
  - Remove an item from inventory

  ### 4. Store Status Updates
  - Set restaurant hours
  - Set store online/offline status
  - Adjust delivery service percentages

