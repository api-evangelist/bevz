  # Development Phase

  Before going live, Bevz will provide you with sandbox credentials to help you implement and test your App integration. You’ll also receive a checklist outlining the minimum required APIs that must be integrated before moving to production.  
  
  As a POS integrator, it’s essential to ensure all required APIs are implemented and tested to meet the criteria for a successful integration.

  ## Quickstart
  Use the following cURL command to test your sandbox credentials and obtain a JWT token for authentication.

  **Sample cURL Request:**
  ```json
  curl --location 'https://sandbox-api.bevz.com/integrator-service/integrators/login' \
  --header 'Content-Type: application/json' \
  --data-raw '{
      "email": "sample_email@bevz.com",
      "password" : "sample_password"
  }'
  ```
  **Sample Response:**
  ```json
  {
      "api_version": "v1.11.3",
      "status_code": 200,
      "message": "Login successful",
      "errors": [],
      "data": {
          "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjdhYjIwNGJiLTRhOGEtNGMwMS1iNDUwLTAzZjgzYmY1ZTk0NCIsImVtYWlsIjoiaGFubmFoQGJldnouY29tIiwiY2xpZW50IjoiSU5URUdSQVRPUiIsInNjb3BlIjoiKiIsInN1YiI6IjEiLCJleHAiOjE3NjA2MjUxNjEuODM0LCJpYXQiOjE3NTgwMzMxNjEuODcyLCJhdWQiOiJCZXZ6In0.32MxKENvgTWif58cRUaHIoHg2nGO8z1tP11PwHoM1"
      }
  }
  ```
  *Note: The token expires every 30 days. To generate a new token, simply log in again.*

