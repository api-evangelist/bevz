  ## 1.11.3 2025-01-21 (updates)
  ### updates
  - Added GrubHub support for [**Post Order Adjustment API**](#tag/Order/operation/postOrderAdjustment).
    - GrubHub now supports `ITEM_UPDATE` and `ITEM_REMOVE` adjustment types.
    - Note: `ITEM_SUBSTITUTE` is not available for GrubHub orders.
    - Only one adjustment per order is allowed for GrubHub.
  - Updated `turn_off_duration` valid values to `"7d"`, `"30d"`, and `"never"` for all delivery services.
  - Added `name` as a required field in the `adjustments` object for `ITEM_SUBSTITUTE` requests.
  - Added GrubHub-specific schema and examples in the API documentation.

