  ## 1.10.7 2024-11-11 (updates)
  - ### [**Upload Menu**](#tag/Stores/operation/postMenu) API Updates
    - Added `merchantSupplied` as an Optional Field in the Payload for Upload Menu API
       - Introduced `merchantSuppliedId` as an optional field in the payload, representing the ID of the integrator's products for better product mapping.
    - The required fields for the [**Upload Menu**](#tag/Stores/operation/postMenu) API request have been updated. The following fields are now required:
        - `upc`
        - `name`
        - `price`
        
        The following fields are no longer required:
        - `size`
        - `quantity`
    - Added `stockcount_column_name` to [**Upload Menu**](#tag/Stores/operation/postMenu) API Payload
      - Introduced a new field, `stockcount_column_name`, in the API payload to allow for customizable stock count column names.
    
  - ### [Provision Existing Store](#tag/Stores/operation/postStore) API Updates
    - Added store data to the API response.
    - Moved the "Cannot provision, store does not exist in Bevz" error from the 400 status code to 404.
    - Enhanced API description for better clarity.
  
  - ### [Get Store Orders](#tag/Order/operation/getStoreOrders) API Updates
    - Added `merchantSupplied` Under `OrderProducts` in Get Order API response.
      - Introduced the `merchantSupplied` field under `OrderProducts` in the Get Order API response for better order detail tracking.
  
  - Added Workflow Image and Enhanced Description in [**Setup Store**](#tag/Preparing-Your-Store/Setup-Store)
     - Included a visual workflow image in the "Setup Store" section.
     - Expanded the description to provide clearer guidance for users during the setup process.

