- name: faq
  description: "# How do I sign up for an Integrator account?\n  To get started with your Bevz integration, please email your request to [support@bevz.com](mailto:support@bevz.com).\n  An Integrator Account\
    \ Manager will guide you through the onboarding process.\n\n# Common HTTP Error Codes\n  Bevz follows standard HTTP status codes to indicate the outcome of API requests:\n\n  `200 OK`\n  > The request\
    \ was successful.\n\n  `201 Created`\n  > The request was successful and resulted in the creation of a new resource.\n\n  `204 No Content`\n  > The request was successful, but there is no content to\
    \ return.\n\n  `400 Bad Request`\n  > The server could not process the request due to client-side input errors.\n    Please review the API response message for more details.\n\n  `401 Unauthorized`\n\
    \  > The request lacks valid authentication credentials.\n\n  `403 Forbidden`\n  > The server understands the request but refuses to authorize it.\n\n  `404 Not Found`\n  > The requested resource could\
    \ not be found.\n\n  `500 Internal Server Error`\n  > The server encountered an unexpected condition that prevented it from fulfilling the request.\n    If you encounter this error, please contact [tech@bevz.com](mailto:tech@bevz.com)\
    \ for assistance.\n\n# Can other integrators see my data?\n  No. Your data is secured, protected, and accessible only by your organization.\n  Bevz applies multiple security checks and validations to\
    \ safeguard our partners’ data.\n\n# How do I deactivate my Integrator account?\n  For any account deactivation or related concerns, please contact [support@bevz.com](mailto:support@bevz.com).\n\n#\
    \ Technical issues & bugs\n  To report a bug or ask questions about the Integrator Service APIs, please email your technical concerns to [tech@bevz.com](mailto:tech@bevz.com)."
  x-displayName: FAQS
- name: Changelog
  description: "## 1.13.0 2026-04-20 (features)\n### features\n- Added Georgia (`GA_LOTTERY`) and Florida (`FL_LOTTERY`) as supported sources in [**Get Lotto Scratcher Games**](#tag/Lotto-Scratcher-Games/operation/getLottoScratcherGames).\n\
    \n## 1.12.0 2026-03-30 (updates)\n### features\n- Added [**Store Status Webhook**](#tag/Webhooks/operation/storeStatusWebhook) to receive real-time notifications when store settings change (e.g., operating\
    \ hours, delivery service configurations).\n\n## 1.11.3 2025-01-21 (updates)\n### updates\n- Added GrubHub support for [**Post Order Adjustment API**](#tag/Order/operation/postOrderAdjustment).\n  -\
    \ GrubHub now supports `ITEM_UPDATE` and `ITEM_REMOVE` adjustment types.\n  - Note: `ITEM_SUBSTITUTE` is not available for GrubHub orders.\n  - Only one adjustment per order is allowed for GrubHub.\n\
    - Updated `turn_off_duration` valid values to `\"7d\"`, `\"30d\"`, and `\"never\"` for all delivery services.\n- Added `name` as a required field in the `adjustments` object for `ITEM_SUBSTITUTE` requests.\n\
    - Added GrubHub-specific schema and examples in the API documentation.\n\n## 1.11.2 2025-11-27 (minor updates)\n### updates\n- Added delivery_type in the request body of [**Test Store Orders**](#tag/Order/operation/testStoreOrders)\
    \ API for better order classification.\n\n## 1.11.1 2025-10-30 (minor updates)\n### updates\n- Implemented [**Get Order by OrderId**](#tag/Order/operation/getOrderId) API.\n- Added date_field in the\
    \ query parameters of [**Get Store Orders**](#tag/Order/operation/getStoreOrders) API for better filtering.\n\n## 1.11.0 2025-10-06 (updates)\n### updates\n- Added Order Adjustments workflow for DoorDash\
    \ and Uber Eats in [**Post Order Adjustment API**](#tag/Order/operation/postOrderAdjustment).\n- Updated Grubhub onboarding process in [**Delivery Services Onboarding API**](#tag/Pick-a-Delivery-Service-for-Onboarding-API/Grubhub-Onboarding).\n\
    - Added Uber Eats onboarding workflow in [**Uber Eats Onboarding API**](#tag/Uber-Eats-Onboarding-API-Workflow).\n\n## 1.10.8 2025-09-04 (minor updates)\n### updates\n- Added merchantSuppliedId column\
    \ in CSV example in [**Get Store Products**](#tag/Store-Products/operation/getProducts) API.\n- Added store products description in [**Store Products**](#tag/Store-Products) API\n- Updated wordings\
    \ `Upload Menu` to `Menu Upload`.\n- Updated `Menu Sync Webhook` to `Menu Upload Webhook`.\n\n## 1.10.7 2024-11-11 (updates)\n- ### [**Upload Menu**](#tag/Stores/operation/postMenu) API Updates\n  -\
    \ Added `merchantSupplied` as an Optional Field in the Payload for Upload Menu API\n     - Introduced `merchantSuppliedId` as an optional field in the payload, representing the ID of the integrator's\
    \ products for better product mapping.\n  - The required fields for the [**Upload Menu**](#tag/Stores/operation/postMenu) API request have been updated. The following fields are now required:\n    \
    \  - `upc`\n      - `name`\n      - `price`\n      \n      The following fields are no longer required:\n      - `size`\n      - `quantity`\n  - Added `stockcount_column_name` to [**Upload Menu**](#tag/Stores/operation/postMenu)\
    \ API Payload\n    - Introduced a new field, `stockcount_column_name`, in the API payload to allow for customizable stock count column names.\n  \n- ### [Provision Existing Store](#tag/Stores/operation/postStore)\
    \ API Updates\n  - Added store data to the API response.\n  - Moved the \"Cannot provision, store does not exist in Bevz\" error from the 400 status code to 404.\n  - Enhanced API description for better\
    \ clarity.\n\n- ### [Get Store Orders](#tag/Order/operation/getStoreOrders) API Updates\n  - Added `merchantSupplied` Under `OrderProducts` in Get Order API response.\n    - Introduced the `merchantSupplied`\
    \ field under `OrderProducts` in the Get Order API response for better order detail tracking.\n\n- Added Workflow Image and Enhanced Description in [**Setup Store**](#tag/Preparing-Your-Store/Setup-Store)\n\
    \   - Included a visual workflow image in the \"Setup Store\" section.\n   - Expanded the description to provide clearer guidance for users during the setup process.\n\n## 1.10.6 2024-07-31 (updates)\n\
    ### updates\n-  updated `orderProducts.$.productSnapshot` fields in [**Order Model**](#tag/models/Order).\n   \n   Affected endpoints:  [**Get Store Orders**](#tag/Order/operation/getStoreOrders) and\
    \ [**Test Store Orders**](#tag/Order/operation/testStoreOrders) 200 response.\n- Added `name` `phoneNumber` fields in payload of [**Update Store**](#tag/Stores/operation/patchStore)\n\n## 1.10.5 2024-07-02\
    \ (minor updates)\n### updates\n- updated query parameters and `200` status response for [**Get Store Products**](#tag/Store-Products/operation/getProducts)\n- updated payload and `200` status response\
    \ for [**Patch Store Products**](#tag/Store-Products/operation/patchProduct)\n\n\n## 1.10.4 2024-01-11 (minor updates)\n### updates\n- moved `callback_url` from Request Body to Query Parameters in [**Generate\
