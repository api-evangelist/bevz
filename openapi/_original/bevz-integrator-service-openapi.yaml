                    Use multiple entries to represent different schedules (e.g., split shifts or varying hours).

                    '
                  items:
                    type: object
                    properties:
                      openTime:
                        type: string
                        description: Opening time in 12-hour format with AM/PM.
                        example: 03:30 AM
                      closeTime:
                        type: string
                        description: Closing time in 12-hour format with AM/PM.
                        example: 02:00 PM
                      days:
                        type: array
                        description: "List of days of the week when these hours apply.\nUse the following mapping:\n  * 1 = Sunday\n  * 2 = Monday\n  * 3 = Tuesday\n  * 4 = Wednesday\n  * 5 = Thursday\n\
                          \  * 6 = Friday\n  * 7 = Saturday\nYou can specify multiple days in a single entry (e.g., `[2, 3, 4, 5, 6]` for Monday–Friday).\n"
                        items:
                          type: integer
                          minimum: 1
                          maximum: 7
                        example:
                        - 1
                        - 2
                        - 3
                address:
                  type: object
                  required:
                  - street1
                  - state
                  - city
                  - zipCode
                  description: Physical address where the store is located.
                  properties:
                    city:
