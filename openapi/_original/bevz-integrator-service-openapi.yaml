  /integrators/{integrator_id}/stores/{store_id}/onboard-delivery-services/ubereats/generate-oauth:
    get:
      tags:
      - Uber Eats Onboarding API Workflow
      operationId: generateOAuth
      summary: Step 1. Generate OAuth URL for Uber Eats onboarding
      description: "Use this endpoint to obtain a unique OAuth URL that will redirect the store owner to Uber Eats for authentication and authorization.  \n\nAfter successful authorization, Uber Eats will\
        \ redirect the user to the specified `redirect_uri` with an authorization code, which can then be exchanged for access tokens.\n\n#### When to Use\n\n- Initiate the Uber Eats onboarding process\
        \ for a store.\n- Allow store owners to securely grant your integration access to their Uber Eats account.\n"
      parameters:
      - name: integrator_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Unique identifier for the integrator.
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier for the store.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: "JWT token for authenticating API requests.  \n"
        example: Bearer yourJWTtoken
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: link
        description: Redirect URI after successful OAuth authorization. Must match the URI registered with Uber Eats.
      responses:
        '200':
          description: Successfully retrieved Ubereats OAuth link
          content:
            application/json:
              schema:
                type: object
                properties:
                  oauth_link:
                    type: string
                    format: link
                    example: https://auth.uber.com/oauth/v2/authorize?client_id=YOUR_CLIENT_ID&response_type=code&scope=STORE_READ+STORE_WRITE&redirect_uri=YOUR_REDIRECT_URI
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
              examples:
                Integrator unauthorized to perform this action!:
                  value:
                    message: Unauthorized request! Please check your permission.
                    errors:
                    - Integrator unauthorized to perform this action!
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User is not authorized to access this resource with an explicit deny
  /integrators/{integrator_id}/stores/{store_id}/onboard-delivery-services/ubereats/exchange-authorization-code:
    post:
      tags:
      - Uber Eats Onboarding API Workflow
      operationId: exchangeCode
      summary: Step 2. Exchange Authorization Code for Access Token
      description: "Use this endpoint as the second step in the Uber Eats onboarding OAuth flow.  \n\nAfter the store owner authorizes your integration via the OAuth URL, Uber Eats will redirect to your\
        \ specified `redirect_uri` with an `authorization_code`.  \n\nSubmit that code here to obtain an access token, which can be used to make authenticated requests to Uber Eats APIs on behalf of the\
        \ store.\n\n#### When to Use\n\n- Immediately after the store owner completes the OAuth authorization step and you receive the `authorization_code` in your redirect handler.\n"
      parameters:
      - name: integrator_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Unique identifier for the integrator.
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier for the store.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: "JWT token for authenticating API requests.  \n"
        example: Bearer yourJWTtoken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                authorization_code:
                  type: string
                  description: The authorization code received from Uber Eats after the user authorizes the application.
                  example: crd.EA.CAESEKbPSOAMB0wtsKCg5fyADcgiATE.134ewdsasde3
                redirect_uri:
                  type: string
                  description: The redirect URI that was used in the initial authorization request. Must match exactly.
                  example: https://yourapp.com/oauth/callback
              required:
              - authorization_code
              - redirect_uri
      responses:
        '200':
          description: Successfully retrieved stores from Ubereats
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: The access token received from UberEats after exchanging the authorization code.
                    example: IA.AQAAAATvVfIsrU8lhn6bW4Z_vF9dft4qmTc0d3uLh6T3pQ
                  stores:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the store on UberEats platform.
                          example: 12345678-9abc-def0-1234-56789abcdef
                        name:
                          type: string
                          description: The name of the store as registered on UberEats.
                          example: Sample Restaurant
                        location:
                          type: object
                          properties:
                            latitude:
                              type: number
                              format: string
                              description: The latitude coordinate of the store's location.
                              example: '37.7749'
                            longitude:
                              type: number
                              format: string
                              description: The longitude coordinate of the store's location.
                              example: '-122.4194'
                            street_address_line_one:
                              type: string
                              description: The physical address of the store.
                              example: 123 Main St, City, State, ZIP
                            city:
                              type: string
                              description: The city where the store is located.
                              example: San Francisco
                            country_code:
                              type: string
                              description: The country code of the store's location.
                              example: US
                            postal_code:
                              type: string
                              description: The postal code of the store's location.
                              example: '94103'
        '400':
          description: Bad request! Please check your input.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
              examples:
                invalid_grant:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - invalid_grant
                invalid_client:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - invalid_client
                invalid_request:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - invalid_request
                invalid_scope:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - invalid_scope
                access_denied:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - access_denied
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
              examples:
                Integrator unauthorized to perform this action!:
                  value:
                    message: Unauthorized request! Please check your permission.
                    errors:
                    - Integrator unauthorized to perform this action!
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User is not authorized to access this resource with an explicit deny
  /integrators/{integrator_id}/stores/{store_id}/onboard-delivery-services/ubereats/provision-store:
    post:
      tags:
      - Uber Eats Onboarding API Workflow
      operationId: provisionStore
      summary: Step 3. Provision Store on Uber Eats
      description: 'Use this endpoint as the final step in the Uber Eats onboarding process.


        After obtaining an access token and the Uber Eats store ID, call this endpoint to link the store in your system with its Uber Eats counterpart.


        This enables menu synchronization, order management, and other integration features between your platform and Uber Eats.


        #### When to Use


        - After successfully exchanging the authorization code for an access token and retrieving the Uber Eats store ID.

        '
      parameters:
      - name: integrator_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Unique identifier for the integrator.
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier for the store.
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: "JWT token for authenticating API requests.  \n"
        example: Bearer yourJWTtoken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  description: The access token received from Uber Eats after exchanging the authorization code.
                  example: IA.AQAAAATvVfIsrU8lhn6bW4Z_vF9dft4qmTc0d3uLh6T3pQ
                uber_store_id:
                  type: string
                  description: The unique identifier for the store on Uber Eats platform.
                  example: 12345678-9abc-def0-1234-56789abcdef
              required:
              - access_token
              - uber_store_id
      responses:
        '200':
          description: Successfully provisioned store with Ubereats
