                        \ token](#tag/Getting-Started/Authentication/Generating-a-JWT-Token).\n"
                      example: sample_email@bevz.com
                    password:
                      type: string
                      description: "Hashed password for the user account.  \nSet during [Create Integrator User](#tag/integrator_users/operation/postUser) and used for authentication when [Generating a\
                        \ JWT token](#tag/Getting-Started/Authentication/Generating-a-JWT-Token).\nPasswords are always returned as a hash for security.\n"
                      example: $2b$10$EixZaYVK1fsbw1ZfbX3OXePaWxn96p36WQoeG6Lruj3vjPGga31lT
                    active:
                      type: boolean
                      description: "Indicates whether the user account is active.  \nActive users can be managed via [Update Integrator Users Access](#tag/integrator_users/operation/putUser) and are permitted\
                        \ to access the API.\n"
                      example: true
