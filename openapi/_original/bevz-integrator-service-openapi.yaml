                          example: 3.99
                        alternativeProductName:
                          type: string
                          description: Other names of the product.
                          example: A&W Root Beer Cans (12 fl oz x 12 ct)
                  deliveryDetails:
                    type: object
                    properties:
                      customerDetails:
                        type: object
                        description: Customer contact information.
                        properties:
                          name:
                            type: string
                            description: Customer name.
                            example: Bevz Staging
                          phone:
                            type: string
                            description: Customer phone number.
                            example: (917) 123-1234
                          email:
                            type: string
                            description: Customer email address.
                          pinCode:
                            type: string
                            description: The pin code to access the customer phone number (For Uber Eats only).
                            example: 555 55 555
                      deliveryType:
                        type: string
                        description: 'Delivery method for the order. Possible values: `PICK_UP`, `DELIVERY`.

                          '
                        example: DELIVERY
                      deliveryInstructions:
                        type: string
                        description: Special instructions for the delivery.
                      deliveryAddress:
                        type: object
                        description: Delivery address details.
                        properties:
                          street1:
                            type: string
                            description: Primary street address.
                            example: 123123 10th St
                          street2:
                            type: string
                            description: Secondary address line (optional).
                          state:
                            type: string
                            description: State or province abbreviation.
                            example: CA
                          city:
                            type: string
                            description: City name.
                            example: Santa Monica
                          zipCode:
                            type: string
                            description: Postal or ZIP code.
                            example: '90401'
                      driver:
                        type: object
                        description: Delivery driver details.
                        properties:
                          name:
                            type: string
                            description: Driver's name.
                            example: John Doe
                          phone:
                            type: string
                            description: Driver's phone number.
                            example: 091234567890
                          estimated_time_arrival:
                            type: string
                            description: Estimated time of arrival for the delivery.
                  fees:
                    type: object
                    description: Breakdown of fees applied to the order.
                    properties:
                      shippingTotal:
                        type: number
                        description: Total shipping fee for the order.
                      tipTotal:
                        type: string
                        description: Total tip amount for the order.
                        example: '0'
                      serviceFeeTotal:
                        type: number
                        description: Total service fee for the order.
                        example: 148
                      taxTotal:
                        type: number
                        description: Total tax applied to the order.
                        example: 28
                      savedTotal:
                        type: number
                        description: Total amount saved (e.g., discounts).
                      rebateTotal:
                        type: number
                        description: Total rebate applied to the order.
                  orderStatus:
                    type: string
                    description: "Current status of the order.  \nPossible values: `PENDING`, `ACCEPTED`, `OUT_FOR_DELIVERY`, `COMPLETED`, `CANCELED`, `EXPIRED`\n"
                    example: COMPLETED
                  orderTotal:
                    type: number
                    description: Total amount for the order, including all fees and taxes.
                    example: 408
                  deliverySource:
                    type: string
                    description: "The delivery platform through which the order was placed.  \nPossible values: `DOORDASH`, `UBEREATS`, `GRUBHUB`\n"
                    example: DOORDASH
                  subTotal:
                    type: number
                    description: Subtotal amount for the order (before fees and taxes).
                    example: 5.34
                  createdAt:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp when the order was created.
                    example: '2023-04-17T12:32:27.304Z'
                  updatedAt:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp when the order was last updated.
                    example: '2023-04-17T12:34:40.376Z'
                  test:
                    type: boolean
                    description: Indicates if this order is a test order.
                    example: true
        '400':
          description: Bad request! Please check your input.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bad request! Please check your input.
              examples:
                Order must be on Active/Accepted state:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Unable to update order details! Order must be on Active/Accepted state.
                Store is disabled, unable to perform this action:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Store is disabled, unable to perform this action.
                Product is not for sale:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Product ${inventory.name} (${adjustmentProductId}) is not for sale.
                Order Products cannot be empty:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Order Products cannot be empty must contain atleast 1 item! If you want to remove the item, please cancel the order itself.
                DD - Doordash Order Adjustment cannot be empty:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Doordash Order Adjustment cannot be empty must contain atleast 1 item!
                UE - UberEats Order Adjustment cannot be empty:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - UberEats Order Adjustment cannot be empty must contain atleast 1 item!
                UE - Product quantity must be less than of the current quantity:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Product ${orderProduct.productSnapshot.name} (${item.productId}) must be less than of the current quantity.
                UE - UberEats only allows an item to be replaced once:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Product ${orderProduct.productSnapshot.name} (${item.productId}) was the replacement item. UberEats only allows an item to be replaced once.
                UE - UberEats exceeded the allowed quantity:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Please select a different item — Exceeded the allowed quantity by Uber Eats, if it contains Alcoholic items, reduce the quantity to meet the standard.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
              examples:
                Integrator unauthorized to perform this action!:
                  value:
                    message: Unauthorized request! Please check your permission.
                    errors:
                    - Integrator unauthorized to perform this action!
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User is not authorized to access this resource with an explicit deny
        '404':
          description: 404 Resource is not found!
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 404 Resource is not found!
                  errors:
                    type: array
                    example:
                    - Product ${inventory.name} (${adjustmentProductId}) does not exists on Doordash master catalog
