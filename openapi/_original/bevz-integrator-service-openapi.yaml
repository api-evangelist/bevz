                                    routingNumber:
                                      type: string
                                      description: Bank routing number for ACH transfers. Must be numbers only.
                                      pattern: ^[\d*]+$
                                      example: '021000021'
                                    accountNumber:
                                      type: string
                                      description: Bank account number for deposits and withdrawals. Must be numbers only.
                                      pattern: ^[\d*]+$
                                      example: 000123456789
                                    dob:
                                      type: string
                                      description: Date of birth of the legal representative (MM/DD/YYYY).
                                      example: 09/25/1995
                                    ssn:
