                          description: "Reason for updating the delivery service settings.\n**Allowed Values:**\n  - out_of_business\n  - operational_issues\n  - delete_store\n  - payment_issue\n  - store_self_disabled_in_their_POS_portal\n\
                            \  - store_pos_connectivity_issues\n"
                        notes:
