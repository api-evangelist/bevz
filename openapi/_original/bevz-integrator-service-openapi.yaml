    \ Model\n- added [**Menu Sync Webhook**](#tag/Webhooks/operation/menuSyncWebhook)\n- added [**Delivery Settings**](#tag/models/DeliverySettings) Model\n\n### updates\n- update attributes in [**Order\
    \ Model**](#tag/models/Order)\n\n### changes\n- Users\n\n  - rename [Users](#tag/integrator_users) to [Integrator Users](#tag/integrator_users)\n    - rename **Manage users access** -> **Retrieve All\
