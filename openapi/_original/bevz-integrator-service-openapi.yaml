    \ all provisioned store\n    - Provision store\n    - Deprovision store\n    - Get store by store_id\n\n## 1.5.0 2023-06-01 (version_update)\n### features\n-  added [Get Integrator Store](#tag/Integrators/operation/getIntegratorStore)\n\
