  /integrators/{integrator_id}/lotto-scratcher-games:
    get:
      tags:
      - Lotto Scratcher Games
      operationId: getLottoScratcherGames
      summary: Get Lotto Scratcher Games
      description: 'Retrieve lottery scratch-off game data from supported state lotteries.


        Use this endpoint to list available lotto scratcher games by source (state lottery) or to look up a specific game by its UPC barcode. The response includes game details such as pricing, odds, top
        prize, and imagery.


        #### Listing Games by Source


        - Pass the `source` query parameter to retrieve all games from a specific state lottery.

        - Use `limit` and `next_page` to paginate through large catalogs.

        - Filter by `status` to retrieve only `ACTIVE` or `DISCONTINUED` games.


        #### UPC Barcode Lookup


        - When a customer''s lottery ticket is scanned at the POS, pass the 12-digit UPC-A barcode along with the `source` to look up the specific game.

        - The system extracts the game number from the barcode and returns the matching game details.

        '
      parameters:
      - name: integrator_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Unique identifier for the integrator.
      - name: source
        in: query
        required: true
        schema:
          type: string
          enum:
          - CA_LOTTERY
          - MA_LOTTERY
          - OH_LOTTERY
          - MI_LOTTERY
          - AZ_LOTTERY
          - CT_LOTTERY
          - IL_LOTTERY
          - GA_LOTTERY
          - FL_LOTTERY
        description: The state lottery source to retrieve games from.
      - name: upc
        in: query
        required: false
        schema:
          type: string
          example: '698720254818'
        description: A 12-digit UPC-A barcode used to look up a specific lotto scratcher game.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - DISCONTINUED
          default: ACTIVE
        description: Filter games by status. Defaults to ACTIVE.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          example: 100
        description: Maximum number of games to return per page.
      - name: next_page
        in: query
        required: false
        schema:
          type: string
        description: Token for fetching the next page of results.
      - name: Authorization
        in: header
        description: JWT token for authenticating API requests.
        example: Bearer yourJWTtoken
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved lotto scratcher games
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: string
                    example: 1.12.0
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully retrieved lotto scratcher games
                  next_page:
                    type: string
                    nullable: true
                    example: eyJzb3VyY2UiOiJDVF9MT1RURVJZIiwiZ2FtZUlkIjoiY3RfbG90dGVyeV8xODUyIn0=
                  count:
                    type: integer
                    example: 42
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        gameId:
                          type: string
                          example: ca_lottery_1555
                          description: Unique identifier for the lotto scratcher game.
                        gameNumber:
                          type: string
                          example: '1555'
                          description: The game number assigned by the state lottery.
                        gameName:
                          type: string
                          example: $5 Crossword
                          description: Display name of the lotto scratcher game.
                        gamePrice:
                          type: integer
                          description: Price in cents (500 = $5.00)
                          example: 500
                        source:
                          type: string
                          enum:
                          - CA_LOTTERY
                          - MA_LOTTERY
                          - OH_LOTTERY
                          - MI_LOTTERY
                          - AZ_LOTTERY
                          - CT_LOTTERY
                          - IL_LOTTERY
                          - GA_LOTTERY
                          - FL_LOTTERY
                          example: CA_LOTTERY
                          description: The state lottery source this game belongs to.
                        upc:
                          type: string
                          nullable: true
                          example: '735975_1555_'
                          description: UPC barcode associated with the game, if available.
                        imageUrl:
                          type: string
                          nullable: true
                          example: https://example.com/game-image.png
                          description: URL of the original game image from the lottery source.
                        ticketOdds:
                          type: string
                          nullable: true
                          example: 1 in 4.23
                          description: Overall odds of winning any prize on this game.
                        topPrize:
                          type: integer
                          nullable: true
                          description: Top prize amount in cents (30000000 = $300,000.00)
                          example: 30000000
                        description:
                          type: string
                          nullable: true
                          description: Description of the lotto scratcher game, if available.
                        status:
                          type: string
                          enum:
                          - ACTIVE
                          - DISCONTINUED
                          example: ACTIVE
                          description: Current availability status of the game.
                        cdnUrl:
                          type: string
                          nullable: true
                          example: https://cdn.example.com/game-image.png
                          description: CDN-hosted URL for the game image.
        '400':
          description: Bad request! Please check your input.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
              examples:
                Missing or invalid source parameter:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - 'source is required and must be one of: CA_LOTTERY, MA_LOTTERY, OH_LOTTERY, MI_LOTTERY, AZ_LOTTERY, CT_LOTTERY, IL_LOTTERY, GA_LOTTERY, FL_LOTTERY'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
              examples:
                Integrator unauthorized to perform this action!:
                  value:
                    message: Unauthorized request! Please check your permission.
                    errors:
                    - Integrator unauthorized to perform this action!
  /integrators/{integrator_id}/stores/{store_id}/orders:
    post:
      tags:
      - Order
      operationId: testStoreOrders
      summary: Test Store Orders
      description: "### Create a Test Order\n\nUse this endpoint to simulate order creation and test your integration with the Bevz platform.  \nThis is ideal for validating your order processing logic,\
        \ webhook handling, and end-to-end workflows before going live.\n\n#### How It Works\n\n- Submit a test order with your desired items, delivery source, and (optionally) delivery instructions and\
        \ address.\n- The system will process the order as if it were real, triggering all standard order notifications and webhooks.\n- Use this to verify your POS or integration receives and handles order\
        \ events correctly.\n"
      parameters:
      - name: integrator_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Unique identifier for the integrator.
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier for the store.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - delivery_source
              - order_items
              properties:
                delivery_source:
                  type: string
                  description: 'The delivery platform for the order. Options: `DOORDASH`, `GRUBHUB`, `UBEREATS`.

                    '
                  example: DOORDASH
                order_items:
                  type: array
                  description: 'Array of items in the order. Each item requires `product_id`, `quantity`, `size`, and `item_count`.

                    '
                  items:
                    required:
                    - orderNotificationUrl
                    - product_id
                    - quantity
                    - size
                    - item_count
