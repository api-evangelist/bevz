                                        bankAccountNumber:
                                          type: string
                                          description: Bank account number for deposits and withdrawals.
                                          example: '000000'
                                        ein:
                                          type: string
                                          description: Employer Identification Number (EIN) for the business.
                                          example: '12345'
                                        legalBusinessName:
                                          type: string
                                          description: Official legal name of the business entity.
                                          example: Bevz Test Business
                                        legalRepName:
                                          type: string
                                          description: Full name of the legal representative for the business.
                                          example: John Doe
                                        legalDOB:
                                          type: string
                                          description: Date of birth of the legal representative (MM/DD/YYYY).
                                          example: 09/25/1995
                                        legalEmail:
                                          type: string
                                          description: Email address of the legal representative.
                                          example: bevz_legal@bevz.com
                                        ssn:
                                          type: string
                                          description: Social Security Number (SSN) of the legal representative.
                                          example: '12345'
                                        typeOfEntity:
                                          type: string
                                          description: "Type of business entity.  \nAllowed values: `sole_proprietorship`, `partnership`, `c_corporation`, `s_corporation`, `limited_liability_company`.\n"
                                          example: sole_proprietorship
components:
  schemas:
    JWT:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          example: developer@bevz.com
        client:
          type: string
          description: Integrator | Portal | Retailer
          example: Integrator
        scope:
          type: string
    Menu:
      type: object
      properties:
        id:
          type: integer
          description: Auto-incrementing unique identifier for the menu upload record.
          example: 1
        store_id:
          type: string
          description: 'Unique identifier of the store where the uploaded menu will be used.

            This value matches the `store_id` path parameter from the [Menu Upload](#tag/Stores/operation/postMenu) endpoint.

            '
          example: 6e066cfe-9122-4c30-a7fc-a8894dd72f4h
        file_path:
          type: string
          description: 'URL or file path where the uploaded menu file (CSV or JSON) is stored.

            This file contains the raw menu data submitted by the integrator.

            '
          example: https://integrator-menu-569241935122.s3.us-west-1.amazonaws.com/raw/a990fb29-3ea7-4e59-b293-a20574807927_b8c49890-67e5-42b8-aaaa-855ffbe92511.csv
        status:
          type: string
          description: "Current processing status of the menu upload.\n\n- `in progress`: The [Menu Upload](#tag/Stores/operation/postMenu) is still being processed.  \n- `completed`: The upload has finished\
            \ processing.\n- `failed`: The upload failed due to critical errors. Contact Bevz support for assistance.\n"
          example: completed
        error_file:
          type: string
          description: 'URL or file path where unmatched or problematic products from the uploaded file are listed.

            Download this file to review and correct any items that failed to upload or match.

            '
          example: https://integrator-menu-569241935122.s3.us-west-1.amazonaws.com/error/a990fb29-3ea7-4e59-b293-a20574807927_b8c49890-67e5-42b8-aaaa-855ffbe92511_error-file.csv
        date:
          type: string
          format: date-time
          description: 'ISO 8601 timestamp indicating when the [Menu Upload](#tag/Stores/operation/postMenu) started.

            '
          example: 2023-03-09 04:18:57.658000+00:00
        time_completed:
          type: string
          format: date-time
          description: 'ISO 8601 timestamp indicating when the [Menu Upload](#tag/Stores/operation/postMenu) completed.

            '
          example: 2023-03-09 04:18:57.658000+00:00
    User:
      type: object
      description: 'Represents an integrator user account on the Bevz platform.

        This object contains all essential information about the user, including identity, authentication credentials, status, and timestamps.

        Use this schema to view, create, or update integrator user records via the API.

        '
      properties:
        id:
          type: number
          description: Unique identifier for the user.
          example: f92b15e2-116b-4503-a25c-347295494136
        integrator_id:
          type: number
          description: Unique identifier of the integrator to which this user belongs.
          example: '220510005'
        email:
          type: string
          description: "Email address registered for the user.  \nThis is provided during [Create Integrator User](#tag/integrator_users/operation/postUser) and is used for [Generating a JWT token](#tag/Getting-Started/Authentication/Generating-a-JWT-Token).\n"
          example: sample_email@bevz.com
        password:
          type: string
          description: "Hashed password for the user account.  \nSet during [Create Integrator User](#tag/integrator_users/operation/postUser) and used for authentication when [Generating a JWT token](#tag/Getting-Started/Authentication/Generating-a-JWT-Token).\n\
            Passwords are always returned as a hash for security.\n"
          example: $2b$10$EixZaYVK1fsbw1ZfbX3OXePaWxn96p36WQoeG6Lruj3vjPGga31lT
        active:
          type: boolean
          description: "Indicates whether the user account is active.  \nActive users can be managed via [Update Integrator Users Access](#tag/integrator_users/operation/putUser) and are permitted to access\
            \ the API.\n"
          example: true
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp indicating when the user account was created.
          example: '2023-02-13T07:00:30.895Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp indicating when the user account was last updated.
          example: '2023-02-13T07:00:30.895Z'
        deleted_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp indicating when the user account was deleted (if applicable).
          example: null
    Store:
      type: object
      description: "Represents a retail store managed on the Bevz platform.  \nThis object contains all essential information about the store, including its identity, contact details, operational hours,\
        \ delivery service settings, and more.\nUse this schema to view, create, or update store records via the API.\n"
      properties:
        storeId:
          type: string
          description: Unique identifier for the store.
          example: a744c900-fe43-4ec8-9ae1-f096c9f50240
        address:
          type: object
          description: Physical address where the store is located.
          properties:
            city:
              type: string
              description: City where the store operates.
              example: Santa Monica
            latitude:
              type: number
              description: Latitude coordinate of the store location (positive or negative float).
              example: 42.3456778143501
            longtitude:
              type: number
              description: Longitude coordinate of the store location (positive or negative float).
              example: -71.09837363184101
            state:
              type: string
              description: State or province abbreviation.
              example: CA
            street1:
              type: string
              description: Primary street address of the store.
              example: 123123 10th St
            zip:
              type: string
              description: Postal or ZIP code.
              example: '90401'
        email:
          type: string
          description: Contact email address for the store.
          example: developer@bevz.com
        enabled:
          type: boolean
          description: Indicates whether the store is active and can operate in the app.
          example: true
        hours:
          type: array
          description: List of store operating hours for each day of the week.
          items:
            type: object
            properties:
              type:
                type: string
                example: DAILY_HOURS
              days:
                type: array
                description: '* 1 Sunday

                  * 2 Monday

                  * 3 Tuesday

                  * 4 Wednesday

                  * 5 Thursday

                  * 6 Friday

                  * 7 Saturday

                  '
                example:
                - 1
                - 2
                - 3
                - 4
                - 5
                - 6
                - 7
              openTime:
                type: string
                format: hh:mm A
                example: 12:00 AM
              closeTime:
                type: string
                format: hh:mm A
                example: 4:00 PM
        name:
          type: string
          description: Display name of the store.
          example: Bevz Test Store
        phone:
          type: string
          description: Primary contact phone number for the store.
          example: 639123456789
        phones:
          type: array
          description: List of additional contacts associated with the store, each with their phone number.
          items:
            type: object
            properties:
              name:
                type: string
                example: John Doe
              number:
                type: string
                example: 639123456789
        taxRate:
          type: string
          description: Sales tax rate (%) applied to purchases at this store.
          example: '9.50'
        updatedAt:
          type: number
          description: Epoch timestamp (in milliseconds) of the last update to the store record.
          example: 1677773721909
        deliverySettings:
          type: object
          description: 'Configuration settings for each supported delivery service (e.g., DoorDash, Grubhub, Uber Eats).

            Includes authorization status, commission rates, menu sync status, and other integration-specific options.

            '
          properties:
            doordash:
              type: object
              description: DoorDash delivery service integration settings.
              properties:
                storeId:
                  type: string
                  description: DoorDash store identifier.
                  example: a744c900-fe43-4ec8-9ae1-f096c9f50240
                authorized:
                  type: boolean
                  description: Whether the store is authorized with DoorDash.
                  example: true
                enabled:
                  type: boolean
                  description: Whether DoorDash integration is enabled for this store.
                  example: true
                roundPrice:
                  type: boolean
                  description: Whether prices should be rounded for DoorDash orders.
                  example: true
                percentToCharge:
                  type: number
                  description: Commission percentage charged for DoorDash orders.
                  example: 17
                revSharePercentage:
                  type: number
                  description: Revenue share percentage for DoorDash.
                  example: 1.5
                reason:
                  type: string
                  description: Reason for any status or configuration changes.
                  example: ''
                note:
                  type: string
                  description: Additional notes regarding DoorDash integration.
                  example: ''
                menuSync:
                  type: object
                  description: Current menu synchronization status with DoorDash.
                  properties:
                    menuSynching:
                      type: boolean
                      description: Indicates if a menu sync is currently in progress.
                      example: false
                    syncStart:
                      type: number
                      description: Epoch timestamp when menu sync started.
                      example: 0
                    syncEnd:
                      type: number
                      description: Epoch timestamp when menu sync ended.
                      example: 0
                    status:
                      type: string
                      description: Result status of the last menu sync (e.g., SUCCESS, FAILURE, IN_PROGRESS).
                      example: SUCCESS
                    menuId:
                      type: string
                      description: DoorDash menu identifier.
                      example: ''
            grubhub:
              type: object
              description: Grubhub delivery service integration settings.
              properties:
                storeId:
                  type: string
                  description: Grubhub store identifier.
                  example: a744c900-fe43-4ec8-9ae1-f096c9f50240
                authorized:
                  type: boolean
                  description: Whether the store is authorized with Grubhub.
                  example: true
                enabled:
                  type: boolean
                  description: Whether Grubhub integration is enabled for this store.
                  example: true
                roundPrice:
                  type: boolean
                  description: Whether prices should be rounded for Grubhub orders.
                  example: true
                percentToCharge:
                  type: number
                  description: Commission percentage charged for Grubhub orders.
                  example: 17
                revSharePercentage:
                  type: number
                  description: Revenue share percentage for Grubhub.
                  example: 1.5
                reason:
                  type: string
                  description: Reason for any status or configuration changes.
                  example: ''
                note:
                  type: string
                  description: Additional notes regarding Grubhub integration.
                  example: ''
                menuSync:
                  type: object
                  description: Current menu synchronization status with Grubhub.
                  properties:
                    menuSynching:
                      type: boolean
                      description: Indicates if a menu sync is currently in progress.
                      example: false
                    syncStart:
                      type: number
                      description: Epoch timestamp when menu sync started.
                      example: 0
                    syncEnd:
                      type: number
                      description: Epoch timestamp when menu sync ended.
                      example: 0
                    status:
                      type: string
                      description: Result status of the last menu sync (e.g., SUCCESS, FAILED).
                      example: SUCCESS
                    menuId:
                      type: string
                      description: Grubhub menu identifier.
                      example: ''
            uberEats:
              type: object
              description: Uber Eats delivery service integration settings.
              properties:
                storeId:
                  type: string
                  description: Uber Eats store identifier.
                  example: a744c900-fe43-4ec8-9ae1-f096c9f50240
                authorized:
                  type: boolean
                  description: Whether the store is authorized with Uber Eats.
                  example: true
                enabled:
                  type: boolean
                  description: Whether Uber Eats integration is enabled for this store.
                  example: true
                roundPrice:
                  type: boolean
                  description: Whether prices should be rounded for Uber Eats orders.
                  example: true
                percentToCharge:
                  type: number
                  description: Commission percentage charged for Uber Eats orders.
                  example: 17
                revSharePercentage:
                  type: number
                  description: Revenue share percentage for Uber Eats.
                  example: 1.5
                reason:
                  type: string
                  description: Reason for any status or configuration changes.
                  example: ''
                note:
                  type: string
                  description: Additional notes regarding Uber Eats integration.
                  example: ''
                menuSync:
                  type: object
                  description: Current menu synchronization status with Uber Eats.
                  properties:
                    menuSynching:
                      type: boolean
                      description: Indicates if a menu sync is currently in progress.
                      example: false
                    syncStart:
                      type: number
                      description: Epoch timestamp when menu sync started.
                      example: 0
                    syncEnd:
                      type: number
                      description: Epoch timestamp when menu sync ended.
                      example: 0
                    status:
                      type: string
                      description: Result status of the last menu sync (e.g., SUCCESS, FAILED).
                      example: SUCCESS
                    menuId:
                      type: string
                      description: Uber Eats menu identifier.
                      example: ''
    IntegratorMenu:
      type: object
      description: 'Represents a menu upload payload for an integrator on the Bevz platform.

        This schema allows integrators to upload or synchronize their store menu, with support for custom column mappings and detailed product information.

        Use this object to create or update a store''s menu via the API.

        '
      required:
      - menu
      properties:
        upc_column_name:
          type: string
          description: 'If the UPC attribute in your `menu` object uses a different key (e.g., `upc_code` instead of `upc`), specify the custom column name here.

            This allows flexible mapping between your data and Bevz''s expected fields.

            '
          example: upc_code
        price_column_name:
          type: string
          description: 'If the price attribute in your `menu` object uses a different key (e.g., `menu_price` instead of `price`), specify the custom column name here.

            '
          example: menu_price
        name_column_name:
          type: string
          description: 'If the name attribute in your `menu` object uses a different key (e.g., `item_name` instead of `name`), specify the custom column name here.

            '
          example: product_name
        stockcount_column_name:
          type: string
          description: 'If the stock count attribute in your `menu` object uses a different key (e.g., `stock` instead of `stockCount`), specify the custom column name here.

            '
          example: stock
        menu:
          type: array
          description: "Array of menu items to be uploaded.  \nEach object in the array represents a product to be added or updated in the store's menu.\n"
          items:
            type: object
            required:
            - name
            - upc
            - price
            properties:
              name:
                type: string
                description: The product name.
                example: Ben & Jerry's the Tonight Dough (16 oz)
              upc:
                type: string
                description: 'The Universal Product Code (UPC) is a unique 12-digit number assigned to each product.

                  Used for product identification, inventory control, and price comparison.

                  '
                example: '76840485116'
              price:
                type: string
                description: The in-store price of the product.
                example: '8.90'
              merchantSuppliedId:
                type: string
                description: 'Optional field representing the integrator''s internal product ID for improved product mapping.

                  Can be any string value.

                  '
                example: e3260b0aa450
              description:
                type: string
                description: Custom product description for your inventory.
                example: Ben and Jerry's The Tonight Dough Caramel & Chocolate Ice Cream
              stock:
                type: string
                description: Number of units available in your inventory.
                example: '10'
              size:
                type: string
                description: The product's unit size or packaging.
                example: 1 Pint
              quantity:
                type: string
                description: The product quantity or packaging type (e.g., "Single", "Pack").
                example: Single
              imageurl:
                type: string
                description: URL of the product image.
                example: https://bevz-media.s3-us-west-1.amazonaws.com/example.png
    Order:
      type: object
      description: 'Represents a customer order placed through the Bevz platform.

        This schema includes all relevant details about the order, such as products, delivery information, fees, status, and timestamps.

        Use this object to view, create, or update order records via the API.

        '
      properties:
        orderId:
          type: string
          description: Unique identifier for the order.
          example: bj1B0tzQEe2B0ysLv-VTcg-test
        integratorId:
          type: string
          description: Unique identifier for the integrator associated with this order.
          example: '220510005'
        ownerId:
          type: string
          description: Unique identifier for the owner of the order (typically the store owner).
          example: fa44331d-1143-4d03-b1fd-f0a61a11db29
        storeId:
          type: string
          description: Unique identifier for the store where the order was placed.
          example: 831fd907-b455-4e92-828b-2e5421d057d7
        customerId:
          type: string
          description: Identifier for the customer placing the order (may be a platform-specific value).
          example: GRUBHUB_CUSTOMER
        orderProducts:
          type: array
          items:
            type: object
            properties:
              productSnapshot:
                type: object
                description: Snapshot of the product details at the time of ordering.
                properties:
                  images:
                    type: array
                    description: List of product images.
                    items:
                      type: object
                      properties:
                        src:
                          type: string
                          description: Image URL.
                          example: https://bevz-media.s3-us-west-1.amazonaws.com/ef81f97b-1d8a-4f91-906d-3542427e99f2.png
                        primary:
                          type: boolean
                          description: Indicates if this is the primary image.
                          example: true
                  quantity:
                    type: string
                    description: Quantity or packaging type (e.g., "6 Pack").
                    example: 6 Pack
                  productId:
                    type: string
                    description: Unique identifier for the product.
                    example: cd017f3f-fbda-41c1-b9d9-842eab06cbea
                  taxable:
                    type: boolean
                    description: Indicates if the product is taxable.
                    example: true
                  description:
                    type: string
                    description: Product description.
                    example: Enjoy the refreshing lemon-lime taste in every sip of 7UP. Free of caffeine and with crisp, carbonated fizz in every bottle, you can indulge in the delicious drink without feeling
                      the effects of caffeine.
                  upc:
                    type: string
                    description: Universal Product Code for the product.
                    example: 078000000382
                  extras:
                    type: object
                    description: Additional product options or add-ons.
                  priority:
                    type: boolean
                    description: Indicates if the product is a priority item in the order.
                    example: false
                  createdAt:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp when the product was created.
                    example: '2019-08-02T15:11:28.608Z'
                  size:
                    type: string
                    description: Size or packaging of the product.
                    example: 12 oz Cans
                  price:
                    type: number
                    format: float
                    description: Price of the product at the time of order.
                    example: 4.99
                  name:
                    type: string
                    description: Name of the product.
                    example: 7 UP
                  disabled:
                    type: boolean
                    description: Indicates if the product is currently disabled.
                    example: false
                  categories:
                    type: object
                    description: Product category hierarchy.
                    properties:
                      L1:
                        type: string
                        description: Top-level category.
                        example: Soft Drinks
                      L2:
                        type: string
                        description: Second-level category.
                        example: Soda
                  updatedAt:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp when the product was last updated.
                    example: '2019-08-02T15:11:28.608Z'
              quantity:
                type: number
                description: Quantity of this product in the order.
                example: 1
              productId:
                type: string
                description: Unique identifier for the product.
                example: a00dd3f1-dac9-4574-8e23-51a94dd7094c
              merchantSuppliedId:
                type: string
                description: Optional merchant-supplied identifier (e.g., SKU or barcode).
                example: 507f191e810c19729de860ea
              selectedPrice:
                type: number
                description: Price of the product at the time of order.
                example: 3.99
              alternativeProductName:
                type: string
                description: Other names of the product.
                example: A&W Root Beer Cans (12 fl oz x 12 ct)
        deliveryDetails:
          type: object
          properties:
            customerDetails:
              type: object
              description: Customer contact information.
              properties:
                name:
                  type: string
                  description: Customer name.
                  example: Bevz Staging
                phone:
                  type: string
                  description: Customer phone number.
                  example: (917) 123-1234
                email:
                  type: string
                  description: Customer email address.
                pinCode:
                  type: string
                  description: The pin code to access the customer phone number (For Uber Eats only).
                  example: 555 55 555
            deliveryType:
              type: string
              description: 'Delivery method for the order. Possible values: `PICK_UP`, `DELIVERY`.

                '
              example: DELIVERY
            deliveryInstructions:
              type: string
              description: Special instructions for the delivery.
            deliveryAddress:
              type: object
              description: Delivery address details.
              properties:
                street1:
                  type: string
                  description: Primary street address.
                  example: 123123 10th St
                street2:
                  type: string
                  description: Secondary address line (optional).
                state:
                  type: string
                  description: State or province abbreviation.
                  example: CA
                city:
                  type: string
                  description: City name.
                  example: Santa Monica
                zipCode:
                  type: string
                  description: Postal or ZIP code.
                  example: '90401'
            driver:
              type: object
              description: Delivery driver details.
              properties:
                name:
                  type: string
                  description: Driver's name.
                  example: John Doe
                phone:
                  type: string
                  description: Driver's phone number.
                  example: 091234567890
                estimated_time_arrival:
                  type: string
                  description: Estimated time of arrival for the delivery.
        fees:
          type: object
          description: Breakdown of fees applied to the order.
          properties:
            shippingTotal:
              type: number
              description: Total shipping fee for the order.
            tipTotal:
              type: string
              description: Total tip amount for the order.
              example: '0'
            serviceFeeTotal:
              type: number
              description: Total service fee for the order.
              example: 148
            taxTotal:
              type: number
              description: Total tax applied to the order.
              example: 28
            savedTotal:
              type: number
              description: Total amount saved (e.g., discounts).
            rebateTotal:
              type: number
              description: Total rebate applied to the order.
        orderStatus:
          type: string
          description: "Current status of the order.  \nPossible values: `PENDING`, `ACCEPTED`, `OUT_FOR_DELIVERY`, `COMPLETED`, `CANCELED`, `EXPIRED`\n"
          example: COMPLETED
        orderTotal:
          type: number
          description: Total amount for the order, including all fees and taxes.
          example: 408
        deliverySource:
          type: string
          description: "The delivery platform through which the order was placed.  \nPossible values: `DOORDASH`, `UBEREATS`, `GRUBHUB`\n"
          example: DOORDASH
        subTotal:
          type: number
          description: Subtotal amount for the order (before fees and taxes).
          example: 5.34
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the order was created.
          example: '2023-04-17T12:32:27.304Z'
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the order was last updated.
          example: '2023-04-17T12:34:40.376Z'
        test:
          type: boolean
          description: Indicates if this order is a test order.
          example: true
    StoreProducts:
      type: object
      description: 'Represents a product available for sale in a specific store on the Bevz platform.

        This schema includes product identity, categorization, inventory, pricing, and availability details.

        Use this object to view, create, or update store product records via the API.

        '
      properties:
        storeId:
          type: string
          description: Unique identifier for the store where this product is listed.
          example: a744c900-fe43-4ec8-9ae1-f096c9f50240
        productId:
          type: string
          description: Unique identifier for the product within the Bevz system.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        quantity:
          type: string
          description: Unit quantity or packaging type for the product (e.g., "Single", "Pack", "Case").
          example: Single
        size:
          type: string
          description: Size or volume of the product, including packaging details.
          example: 375.00 ML Glass Bottle
        upc:
          type: string
          description: Universal Product Code (UPC) for the product.
          example: 082000003809
        categoryL1:
          type: string
          description: Top-level product category (e.g., "Liquor", "Snacks").
          example: Liquor
        categoryL2:
          type: string
          description: Second-level product category (e.g., "Rum", "Chips").
          example: Rum
        name:
          type: string
          description: Display name of the product.
          example: Captain Morgan White Rum
        stockCount:
          type: integer
          description: Current inventory count for this product in the store.
          example: 1
        images:
          type: array
          description: List of image URLs representing the product.
          items:
            type: string
            format: uri
          example: []
        forSale:
          type: boolean
          description: Indicates if the product is currently available for sale in the store.
          example: true
        inStorePrice:
          type: number
          format: float
          description: Price of the product for in-store purchases (in store's currency).
          example: 7.99
        isAvailableOnDoorDash:
          type: boolean
          description: Indicates if the product is available for sale on DoorDash.
          example: true
        merchantSuppliedId:
          type: string
          description: Optional merchant-supplied identifier for the product (e.g., SKU or barcode).
          example: '72518102101'
        prices:
          type: object
          description: 'Channel-specific pricing for the product.

            Use these fields to set or view prices for each supported delivery service.

            '
          properties:
            doordashPrice:
              type: number
              format: float
              description: Price of the product on DoorDash.
              example: 8.99
            uberEatsPrice:
              type: number
              format: float
              description: Price of the product on Uber Eats.
              example: 0
            grubhubPrice:
              type: number
              format: float
              description: Price of the product on Grubhub.
              example: 0
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the product was added to the store.
          example: '2023-02-13T07:00:30.895Z'
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the product was last updated.
          example: '2023-02-13T07:00:30.895Z'
    LottoScratcherGame:
      type: object
      properties:
        gameId:
          type: string
          example: ca_lottery_1555
          description: Unique identifier for the lotto scratcher game.
        gameNumber:
          type: string
          example: '1555'
          description: The game number assigned by the state lottery.
        gameName:
          type: string
          example: $5 Crossword
          description: Display name of the lotto scratcher game.
        gamePrice:
          type: integer
          description: Price in cents (500 = $5.00)
          example: 500
        source:
          type: string
          enum:
          - CA_LOTTERY
          - MA_LOTTERY
          - OH_LOTTERY
          - MI_LOTTERY
          - AZ_LOTTERY
          - CT_LOTTERY
          - IL_LOTTERY
          - GA_LOTTERY
          - FL_LOTTERY
          example: CA_LOTTERY
          description: The state lottery source this game belongs to.
        upc:
          type: string
          nullable: true
          example: '735975_1555_'
          description: UPC barcode associated with the game, if available.
        imageUrl:
          type: string
          nullable: true
          example: https://example.com/game-image.png
          description: URL of the original game image from the lottery source.
        ticketOdds:
          type: string
          nullable: true
          example: 1 in 4.23
          description: Overall odds of winning any prize on this game.
        topPrize:
          type: integer
          nullable: true
          description: Top prize amount in cents (30000000 = $300,000.00)
          example: 30000000
        description:
          type: string
          nullable: true
          description: Description of the lotto scratcher game, if available.
        status:
          type: string
          enum:
          - ACTIVE
          - DISCONTINUED
          example: ACTIVE
          description: Current availability status of the game.
        cdnUrl:
          type: string
          nullable: true
          example: https://cdn.example.com/game-image.png
          description: CDN-hosted URL for the game image.
    CreateStore:
      type: object
      properties:
        account:
          type: object
          description: 'Contains the account credentials for the store owner.

            This information is used to create a user account associated with the new store.

            '
          properties:
            emailAddress:
              type: string
              description: 'Email address for the store owner''s account.

                This will be used as the username for login and for account-related notifications.

                '
              example: sample_email@bevz.com
            password:
              type: string
              description: 'Password for the store owner''s account.

                Must meet security requirements as defined by the platform (e.g., minimum length, character types).

                '
              example: sample_password
            confirmPassword:
              type: string
              description: 'Confirmation of the password to ensure accuracy during account creation.

                Must match the value provided in the `password` field.

                '
              example: sample_password
        operationHours:
          type: array
          description: 'Defines the store''s operating hours for specific days of the week.

            Each entry specifies the opening and closing times, as well as the days these hours apply.

            Multiple entries can be used to represent different schedules (e.g., split shifts or varying hours on different days).

            '
          items:
            type: object
            properties:
              openTime:
                type: string
                description: Opening time for the store on the specified days, in 12-hour format with AM/PM.
                format: hh:mm A
                example: 03:30 AM
              closeTime:
                type: string
                description: Closing time for the store on the specified days, in 12-hour format with AM/PM.
                format: hh:mm A
                example: 02:00 PM
              days:
                type: array
                description: "List of days of the week when these hours apply.\nUse the following mapping:\n  * 1 = Sunday\n  * 2 = Monday\n  * 3 = Tuesday\n  * 4 = Wednesday\n  * 5 = Thursday\n  * 6 =\
                  \ Friday\n  * 7 = Saturday\nYou can specify multiple days in a single entry (e.g., `[2, 3, 4, 5, 6]` for Monday–Friday).\n"
                items:
                  type: integer
                  minimum: 1
                  maximum: 7
                example:
                - 1
                - 2
                - 3
        store:
          type: object
          description: 'Contains essential details about the store, including its name, address, and contact information.

            '
          properties:
            name:
              type: string
              description: The display name of the store.
              example: Bevz Test Store
            address:
              type: object
              required:
              - street1
              - state
              - city
              - zipCode
              description: Physical address where the store is located.
              properties:
                city:
                  type: string
                  description: City where the store operates.
                  example: Santa Monica
                state:
                  type: string
                  description: State or province abbreviation.
                  example: CA
                street1:
                  type: string
                  description: Primary street address of the store.
                  example: 123123 10th St
                street2:
                  type: string
                  description: Secondary address line (optional)
                  example: ''
                zipCode:
                  type: string
                  description: Postal or ZIP code.
                  example: '90401'
            phoneNumber:
              type: string
              description: Primary contact phone number for the store.
              example: '7852630348'
            emailAddress:
              type: string
              description: Contact email address for the store.
              example: bevz_test_store@bevz.com
    DeliverySettings:
      type: object
      required:
      - deliveryService
      discriminator:
        propertyName: deliveryService
        mapping:
          DOORDASH: '#/components/schemas/DeliverySettingsDD'
          GRUBHUB: '#/components/schemas/DeliverySettingsGH'
      properties:
        deliveryService:
          type: string
          description: DOORDASH | GRUBHUB
    DeliverySettingsGH:
      allOf:
      - $ref: '#/components/schemas/DeliverySettings'
      - type: object
        required:
        - isExisting
        properties:
          isExisting:
            type: boolean
            description: 'Indicates if the store already exists on the selected delivery service.

              '
          data:
            type: object
            required:
            - firstName
            - lastName
            - salesTax
            properties:
              firstName:
                type: string
                description: Store owner's first name.
                example: John
              lastName:
                type: string
                description: Store owner's last name.
                example: Doe
              email:
                type: string
                description: Store owner's email address (optional).
                example: john.doe@email.com
              salesTax:
                type: string
                description: Sales tax rate for the store.
                example: '8.75'
              sentitiveData:
                type: object
                required:
                - bankName
                - routingNumber
                - bankAccountNumber
                - ein
                - legalBusinessName
                - legalRepName
                - legalDOB
                - legalEmail
                - ssn
                - typeOfEntity
                properties:
                  routingNumber:
                    type: string
                    description: Bank routing number for ACH transfers.
                    example: '12345'
                  bankAccountNumber:
                    type: string
                    description: Bank account number for deposits and withdrawals.
                    example: '000000'
                  ein:
                    type: string
                    description: Employer Identification Number (EIN) for the business.
                    example: '12345'
                  legalBusinessName:
                    type: string
                    description: Official legal name of the business entity.
                    example: Bevz Test Business
                  legalDOB:
                    type: string
                    description: Date of birth of the legal representative (MM/DD/YYYY).
                    example: 09/25/1995
                  legalEmail:
                    type: string
                    description: Email address of the legal representative.
                    example: bevz_legal@bevz.com
                  ssn:
                    type: string
                    description: Social Security Number (SSN) of the legal representative.
                    example: '12345'
                  typeOfEntity:
                    type: string
                    description: "Type of business entity.  \nAllowed values: `sole_proprietorship`, `partnership`, `c_corporation`, `s_corporation`, `limited_liability_company`.\n"
                    example: sole_proprietorship
    DeliverySettingsDD:
      allOf:
      - $ref: '#/components/schemas/DeliverySettings'
      - type: object
        required:
        - isExisting
        properties:
          isExisting:
            type: boolean
            description: 'Indicates if the store already exists on the selected delivery service.

              '
          data:
            type: object
            required:
            - storeId
            - firstName
            - lastName
            - email
            - phone
            - legalBusinessName
            - entity
            - ein
            - routingNumber
            - accountNumber
            - dob
            - ssn
            properties:
              storeId:
                type: string
                description: Unique identifier for the store.
                example: dc89f739-4537-44df-8677-a805083ce2de
              firstName:
                type: string
                description: Store owner's first name.
                example: John
              lastName:
                type: string
                description: Store owner's last name.
                example: Doe
              email:
                type: string
                description: Store owner's email address.
                example: john.doe@email.com
              phone:
                type: string
                description: Store owner's phone number.
                example: '2344345435'
              legalBusinessName:
                type: string
                description: Official legal name of the business entity.
                example: Bevz Test Business
              entity:
                type: string
                description: 'Type of business entity.

                  Allowed values: `sole_proprietorship`, `partnership`, `c_corporation`, `s_corporation`, `limited_liability_company`.

                  '
                example: sole_proprietorship
              ein:
                type: string
                description: Employer Identification Number (EIN) for the business. Must be numbers only.
                pattern: ^[\d*]+$
                example: '123456789'
              routingNumber:
                type: string
                description: Bank routing number for ACH transfers. Must be numbers only.
                pattern: ^[\d*]+$
                example: '021000021'
              accountNumber:
                type: string
                description: Bank account number for deposits and withdrawals. Must be numbers only.
                pattern: ^[\d*]+$
                example: 000123456789
              dob:
                type: string
                description: Date of birth of the legal representative (MM/DD/YYYY).
                example: 09/25/1995
              ssn:
                type: string
                description: Last 4 digits of the Social Security Number (SSN) of the legal representative. Must be 4 digits only.
                pattern: ^\d{4}$
                example: '1234'
              taxRate:
                type: string
                description: Sales tax rate for the store (optional).
                example: '8.75'
              carriesCbd:
                type: boolean
                description: Indicates if the store carries CBD products (optional).
                example: false
              carriesOralNicotine:
                type: boolean
                description: Indicates if the store carries oral nicotine products (optional).
                example: false
