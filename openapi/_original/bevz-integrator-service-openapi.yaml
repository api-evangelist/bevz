                                        ein:
                                          type: string
                                          description: Employer Identification Number (EIN) for the business.
                                          example: '12345'
                                        legalBusinessName:
                                          type: string
                                          description: Official legal name of the business entity.
                                          example: Bevz Test Business
                                        legalDOB:
                                          type: string
