      description: 'Update the details of a specific product in a store.


        Use this endpoint to modify product attributes such as price, stock count, sale status, display name, or merchant-supplied ID.

        Only the fields provided in the request body will be updated; all other fields will remain unchanged.


        Typical use cases include:

        - Adjusting inventory levels after a sale or restock.

        - Updating the product''s in-store price.

        - Changing the product''s display name or marking it as unavailable for sale.

        '
      requestBody:
        description: 'JSON payload specifying the product fields to update.

          Only include the fields you wish to modify.

          '
        content:
          application/json:
            schema:
              type: object
              properties:
                inStorePrice:
                  type: number
                  format: float
                  description: Updated in-store price for the product.
                  example: 8.99
                stockCount:
                  type: number
                  description: Updated inventory count for the product.
                  example: 5
                forSale:
