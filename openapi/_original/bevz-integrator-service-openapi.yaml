    \ fields in `pricingOverride` response in [**Get Store Products**](#tag/Store-Products/operation/getProducts) API\n- added response in [**Patch Store Products**](#tag/Store-Products/operation/patchProduct)\
    \ API\n\n## 1.8.0 2023-07-13 (version_update)\n### features\n- added **Guides**\n- added [**Test Store Orders**](#tag/Order/operation/testStoreOrders) API\n- added [**Generate Checkout Link**](#tag/Stores/operation/generateCheckoutLink)\
    \ API\n\n### changes\n- change url of [**Retrieve the menu upload status**](#tag/Stores/operation/getMenu) from `{base_url}/integrators/{integrator_id}/stores/{store_id}/menu`\n  `{base_url}/integrators/{integrator_id}/stores/{store_id}/menu/{menu_id}`\n\
