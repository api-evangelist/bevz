      operationId: postOrderAdjustment
      summary: Post Order Adjustment
      description: "\n### Adjust Items in an Order\n\nUse this endpoint to update, remove, or substitute items in an existing order—especially when fulfilling orders from delivery platforms like DoorDash, Uber Eats, and GrubHub.\nThis allows you to keep the order accurate and up-to-date if items are out of stock, need to be replaced, or require quantity changes.\n\n#### Supported Delivery Services\n\n| Service | ITEM_UPDATE | ITEM_REMOVE | ITEM_SUBSTITUTE |\n|---------|-------------|-------------|-----------------|\n| DOORDASH | ✓ | ✓ | ✓ |\n| UBEREATS | ✓ | ✓ | ✓ |\n| GRUBHUB | ✓ | ✓ | ✗ |\n\n> **Note:**\n> GrubHub only supports `ITEM_UPDATE` and `ITEM_REMOVE` adjustment types. Substitutions are not available for GrubHub orders.\n\n#### Supported Adjustment Types\n\n- **ITEM_UPDATE**: Change the quantity of an item in the order (e.g., customer requests fewer units).\n- **ITEM_REMOVE**: Remove an item that cannot be fulfilled from the order.\n- **ITEM_REMOVE with turn off**: Remove an item and temporarily hide it from your menu for a specified duration.\n- **ITEM_SUBSTITUTE** *(DoorDash & Uber Eats only)*: Replace an unavailable item with a substitute product.\n- **ITEM_SUBSTITUTE with turn off** *(DoorDash & Uber Eats only)*: Substitute an item and also temporarily turn off the original item from your menu.\n\n#### Turn Off Duration Options\n\nWhen using `turn_off: true`, specify the duration with `turn_off_duration`:\n- `\"7d\"` - Turn off for 7 days\n- `\"30d\"` - Turn off for 30 days\n- `\"never\"` - Turn off indefinitely (until manually re-enabled)\n\n#### How It Works\n\n- Specify the delivery service (`DOORDASH`, `UBEREATS`, or `GRUBHUB`) and provide an array of item adjustments.\n- For each item, indicate the adjustment type and provide relevant details (such as new quantity, substitute item info, or turn-off duration).\n- The system will update the order accordingly and, if requested, update menu availability for the affected items.\n- **Important:** The order must be in `ACCEPTED` state to allow adjustments.\n\n#### Example Scenarios\n\n- **A customer orders two sodas, but only one is available:**\n  Use `ITEM_UPDATE` to adjust the quantity.\n- **An item is out of stock:**\n  Use `ITEM_REMOVE` to remove it, and optionally set `turn_off` to temporarily hide it from your menu.\n- **A product is unavailable, but you can offer a substitute (DoorDash/Uber Eats):**\n  Use `ITEM_SUBSTITUTE` and provide the substitute item details.\n\n#### Notes\n  - For substitutions, provide the replacement item details in the `adjustments` object (requires `productId`, `name`, `quantity`, and `price`).\n  - Use `turn_off` and `turn_off_duration` to temporarily hide unavailable items from your menu.\n  - GrubHub orders only allow one adjustment per order.\n"
      parameters:
      - name: integrator_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Unique identifier for the integrator.
      - name: store_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier for the store.
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier for the order within the store.
      - name: Authorization
        in: header
        description: JWT token for authenticating API requests.
        example: Bearer yourJWTtoken
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - deliveryService
              - items
              discriminator:
                propertyName: deliveryService
                mapping:
                  DOORDASH: ../../schemas/OrderAdjustment/OrderAdjustmentDD.yaml
                  UBEREATS: ../../schemas/OrderAdjustment/OrderAdjustmentUE.yaml
                  GRUBHUB: ../../schemas/OrderAdjustment/OrderAdjustmentGH.yaml
              properties:
                deliveryService:
                  type: string
                  enum:
                  - DOORDASH
                  - UBEREATS
                  - GRUBHUB
                  description: 'The delivery platform for which the adjustment applies.

                    Supported values are `"DOORDASH"`, `"UBEREATS"`, and `"GRUBHUB"`.


                    **Note:** GrubHub only supports `ITEM_UPDATE` and `ITEM_REMOVE` adjustment types.

                    '
            examples:
              Item Update:
                value:
                  deliveryService: DOORDASH
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_UPDATE
                    quantity: 1
              Item Remove:
                value:
                  deliveryService: DOORDASH
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_REMOVE
              Item Remove with Turn Off:
                value:
                  deliveryService: DOORDASH
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_REMOVE
                    turn_off: true
                    turn_off_duration: 7d
              Item Substitute - DD:
                value:
                  deliveryService: DOORDASH
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_SUBSTITUTE
                    adjustments:
                      productId: 94b653e4-e394-4330-a714-43e764abe843
                      name: Coke 1.75ml
                      quantity: 1
                      price: 17.99
              Item Substitute with Turn Off - DD:
                value:
                  deliveryService: DOORDASH
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_SUBSTITUTE
                    adjustments:
                      productId: 94b653e4-e394-4330-a714-43e764abe843
                      name: Coke 1.75ml
                      quantity: 1
                      price: 17.99
                    turn_off: true
                    turn_off_duration: 7d
              Item Substitute - UE:
                value:
                  deliveryService: UBEREATS
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_SUBSTITUTE
                    adjustments:
                      productId: 94b653e4-e394-4330-a714-43e764abe843
                      name: Pepsi 1.5L
                      quantity: 1
                      price: 17.99
              Item Substitute with Turn Off - UE:
                value:
                  deliveryService: UBEREATS
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_SUBSTITUTE
                    adjustments:
                      productId: 94b653e4-e394-4330-a714-43e764abe843
                      name: Coke 1.75ml
                      quantity: 1
                      price: 17.99
                    turn_off: true
                    turn_off_duration: 7d
              Item Update - GH:
                value:
                  deliveryService: GRUBHUB
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_UPDATE
                    quantity: 1
              Item Remove - GH:
                value:
                  deliveryService: GRUBHUB
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_REMOVE
              Item Remove with Turn Off - GH:
                value:
                  deliveryService: GRUBHUB
                  items:
                  - productId: 94b653e4-e394-4330-a714-43e764abe843
                    adjustmentType: ITEM_REMOVE
                    turn_off: true
                    turn_off_duration: 7d
      responses:
        '200':
          description: Order adjusment successful
          content:
            application/json:
              schema:
                type: object
                description: 'Represents a customer order placed through the Bevz platform.

                  This schema includes all relevant details about the order, such as products, delivery information, fees, status, and timestamps.

                  Use this object to view, create, or update order records via the API.

                  '
                properties:
                  orderId:
                    type: string
                    description: Unique identifier for the order.
                    example: bj1B0tzQEe2B0ysLv-VTcg-test
                  integratorId:
                    type: string
                    description: Unique identifier for the integrator associated with this order.
                    example: '220510005'
                  ownerId:
                    type: string
                    description: Unique identifier for the owner of the order (typically the store owner).
                    example: fa44331d-1143-4d03-b1fd-f0a61a11db29
                  storeId:
                    type: string
                    description: Unique identifier for the store where the order was placed.
                    example: 831fd907-b455-4e92-828b-2e5421d057d7
                  customerId:
                    type: string
                    description: Identifier for the customer placing the order (may be a platform-specific value).
                    example: GRUBHUB_CUSTOMER
                  orderProducts:
                    type: array
                    items:
                      type: object
                      properties:
                        productSnapshot:
                          type: object
                          description: Snapshot of the product details at the time of ordering.
                          properties:
                            images:
                              type: array
                              description: List of product images.
                              items:
                                type: object
                                properties:
                                  src:
                                    type: string
                                    description: Image URL.
                                    example: https://bevz-media.s3-us-west-1.amazonaws.com/ef81f97b-1d8a-4f91-906d-3542427e99f2.png
                                  primary:
                                    type: boolean
                                    description: Indicates if this is the primary image.
                                    example: true
                            quantity:
                              type: string
                              description: Quantity or packaging type (e.g., "6 Pack").
                              example: 6 Pack
                            productId:
                              type: string
                              description: Unique identifier for the product.
                              example: cd017f3f-fbda-41c1-b9d9-842eab06cbea
                            taxable:
                              type: boolean
                              description: Indicates if the product is taxable.
                              example: true
                            description:
                              type: string
                              description: Product description.
                              example: Enjoy the refreshing lemon-lime taste in every sip of 7UP. Free of caffeine and with crisp, carbonated fizz in every bottle, you can indulge in the delicious drink without feeling the effects of caffeine.
                            upc:
                              type: string
                              description: Universal Product Code for the product.
                              example: 078000000382
                            extras:
                              type: object
                              description: Additional product options or add-ons.
                            priority:
                              type: boolean
                              description: Indicates if the product is a priority item in the order.
                              example: false
                            createdAt:
                              type: string
                              format: date-time
                              description: ISO 8601 timestamp when the product was created.
                              example: '2019-08-02T15:11:28.608Z'
                            size:
                              type: string
                              description: Size or packaging of the product.
                              example: 12 oz Cans
                            price:
                              type: number
                              format: float
                              description: Price of the product at the time of order.
                              example: 4.99
                            name:
                              type: string
                              description: Name of the product.
                              example: 7 UP
                            disabled:
                              type: boolean
                              description: Indicates if the product is currently disabled.
                              example: false
                            categories:
                              type: object
                              description: Product category hierarchy.
                              properties:
                                L1:
                                  type: string
                                  description: Top-level category.
                                  example: Soft Drinks
                                L2:
                                  type: string
                                  description: Second-level category.
                                  example: Soda
                            updatedAt:
                              type: string
                              format: date-time
                              description: ISO 8601 timestamp when the product was last updated.
                              example: '2019-08-02T15:11:28.608Z'
                        quantity:
                          type: number
                          description: Quantity of this product in the order.
                          example: 1
                        productId:
                          type: string
                          description: Unique identifier for the product.
                          example: a00dd3f1-dac9-4574-8e23-51a94dd7094c
                        merchantSuppliedId:
                          type: string
                          description: Optional merchant-supplied identifier (e.g., SKU or barcode).
                          example: 507f191e810c19729de860ea
                        selectedPrice:
                          type: number
                          description: Price of the product at the time of order.
                          example: 3.99
                        alternativeProductName:
                          type: string
                          description: Other names of the product.
                          example: A&W Root Beer Cans (12 fl oz x 12 ct)
                  deliveryDetails:
                    type: object
                    properties:
                      customerDetails:
                        type: object
                        description: Customer contact information.
                        properties:
                          name:
                            type: string
                            description: Customer name.
                            example: Bevz Staging
                          phone:
                            type: string
                            description: Customer phone number.
                            example: (917) 123-1234
                          email:
                            type: string
                            description: Customer email address.
                          pinCode:
                            type: string
                            description: The pin code to access the customer phone number (For Uber Eats only).
                            example: 555 55 555
                      deliveryType:
                        type: string
                        description: 'Delivery method for the order. Possible values: `PICK_UP`, `DELIVERY`.

                          '
                        example: DELIVERY
                      deliveryInstructions:
                        type: string
                        description: Special instructions for the delivery.
                      deliveryAddress:
                        type: object
                        description: Delivery address details.
                        properties:
                          street1:
                            type: string
                            description: Primary street address.
                            example: 123123 10th St
                          street2:
                            type: string
                            description: Secondary address line (optional).
                          state:
                            type: string
                            description: State or province abbreviation.
                            example: CA
                          city:
                            type: string
                            description: City name.
                            example: Santa Monica
                          zipCode:
                            type: string
                            description: Postal or ZIP code.
                            example: '90401'
                      driver:
                        type: object
                        description: Delivery driver details.
                        properties:
                          name:
                            type: string
                            description: Driver's name.
                            example: John Doe
                          phone:
                            type: string
                            description: Driver's phone number.
                            example: 091234567890
                          estimated_time_arrival:
                            type: string
                            description: Estimated time of arrival for the delivery.
                  fees:
                    type: object
                    description: Breakdown of fees applied to the order.
                    properties:
                      shippingTotal:
                        type: number
                        description: Total shipping fee for the order.
                      tipTotal:
                        type: string
                        description: Total tip amount for the order.
                        example: '0'
                      serviceFeeTotal:
                        type: number
                        description: Total service fee for the order.
                        example: 148
                      taxTotal:
                        type: number
                        description: Total tax applied to the order.
                        example: 28
                      savedTotal:
                        type: number
                        description: Total amount saved (e.g., discounts).
                      rebateTotal:
                        type: number
                        description: Total rebate applied to the order.
                  orderStatus:
                    type: string
                    description: "Current status of the order.  \nPossible values: `PENDING`, `ACCEPTED`, `OUT_FOR_DELIVERY`, `COMPLETED`, `CANCELED`, `EXPIRED`\n"
                    example: COMPLETED
                  orderTotal:
                    type: number
                    description: Total amount for the order, including all fees and taxes.
                    example: 408
                  deliverySource:
                    type: string
                    description: "The delivery platform through which the order was placed.  \nPossible values: `DOORDASH`, `UBEREATS`, `GRUBHUB`\n"
                    example: DOORDASH
                  subTotal:
                    type: number
                    description: Subtotal amount for the order (before fees and taxes).
                    example: 5.34
                  createdAt:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp when the order was created.
                    example: '2023-04-17T12:32:27.304Z'
                  updatedAt:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp when the order was last updated.
                    example: '2023-04-17T12:34:40.376Z'
                  test:
                    type: boolean
                    description: Indicates if this order is a test order.
                    example: true
        '400':
          description: Bad request! Please check your input.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bad request! Please check your input.
              examples:
                Order must be on Active/Accepted state:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Unable to update order details! Order must be on Active/Accepted state.
                Store is disabled, unable to perform this action:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Store is disabled, unable to perform this action.
                Product is not for sale:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Product ${inventory.name} (${adjustmentProductId}) is not for sale.
                Order Products cannot be empty:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Order Products cannot be empty must contain atleast 1 item! If you want to remove the item, please cancel the order itself.
                DD - Doordash Order Adjustment cannot be empty:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Doordash Order Adjustment cannot be empty must contain atleast 1 item!
                UE - UberEats Order Adjustment cannot be empty:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - UberEats Order Adjustment cannot be empty must contain atleast 1 item!
                UE - Product quantity must be less than of the current quantity:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Product ${orderProduct.productSnapshot.name} (${item.productId}) must be less than of the current quantity.
                UE - UberEats only allows an item to be replaced once:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Product ${orderProduct.productSnapshot.name} (${item.productId}) was the replacement item. UberEats only allows an item to be replaced once.
                UE - UberEats exceeded the allowed quantity:
                  value:
                    message: Bad request! Please check your input.
                    errors:
                    - Please select a different item — Exceeded the allowed quantity by Uber Eats, if it contains Alcoholic items, reduce the quantity to meet the standard.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: array
              examples:
                Integrator unauthorized to perform this action!:
                  value:
                    message: Unauthorized request! Please check your permission.
                    errors:
                    - Integrator unauthorized to perform this action!
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User is not authorized to access this resource with an explicit deny
        '404':
          description: 404 Resource is not found!
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 404 Resource is not found!
                  errors:
                    type: array
                    example:
                    - Product ${inventory.name} (${adjustmentProductId}) does not exists on Doordash master catalog
