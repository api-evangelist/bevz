name: Bevz
description: >-
  Bevz is a delivery-management platform built for liquor stores and convenience retailers that
  consolidates multiple third-party delivery apps (DoorDash, Uber Eats, GrubHub) into a single
  dashboard. Its products cover menu management across platforms (Connect), AI-powered marketing and
  local promotion on Yelp, Google, and Facebook (Reach), cross-platform performance analytics
  (Reporting+), and a white-label direct-delivery storefront for restricted items (Shop.Bevz). Bevz
  bundles an iPad plus software, access to a 215,000+ product catalog, barcode scanning, onboarding,
  and training. Behind the merchant product Bevz operates a real partner API: the Bevz Integrator
  Service, a REST API documented with a published OpenAPI 3.0.3 contract covering 30 operations
  across store provisioning, menu upload and sync, product catalog maintenance, order lifecycle
  management, order adjustments and delivery-service onboarding for DoorDash, Grubhub and Uber Eats,
  plus three outbound webhooks. It is aimed at POS vendors and third-party integrators, is
  credentialed by Bevz rather than self-serve, and runs a separate sandbox environment with a formal
  certification path to production. Bevz is a Techstars-backed company.
