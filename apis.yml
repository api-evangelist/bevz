- aid: bevz:bevz-uber-eats-onboarding-api-workflow-api
  name: Bevz Uber Eats Onboarding API Workflow API
  description: >-
    The Uber Eats API allows you to onboard your store to Uber Eats and manage related operations.


    Uber Eats onboarding is a three-step process:

    1. **Generate OAuth URL:** Obtain an authorization link for the store owner to grant access.

    2. **Exchange Authorization Code:** After authorization, exchange the received code for an access
    token.

    3. **Provision Store:** Use the access token and Uber Eats store ID to complete the onboarding and
    enable integration features.


    ### Process Flow

