- aid: bevz:bevz-lotto-scratcher-games-api
  name: Bevz Lotto Scratcher Games API
  description: >-
    ## Lotto Scratcher Games


    Retrieve lottery scratch-off game data from supported state lotteries. This endpoint provides game
    catalogs that can be used to display lotto ticket information in POS systems.


    ### Supported Lotteries

    - California (CA_LOTTERY)

    - Massachusetts (MA_LOTTERY)

    - Ohio (OH_LOTTERY)

    - Michigan (MI_LOTTERY)

    - Arizona (AZ_LOTTERY)

    - Connecticut (CT_LOTTERY)

    - Illinois (IL_LOTTERY)

    - Georgia (GA_LOTTERY)

    - Florida (FL_LOTTERY)


    ### UPC Barcode Lookup

    When a customer's lottery ticket is scanned, pass the 12-digit UPC-A barcode along with the source
    to look up the specific game. The system extracts the game number from the barcode and returns the
    matching game details.
