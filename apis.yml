apis:
- name: Bevz Integrator Service
  description: >-
    The Bevz Integrator Service is a partner REST API that lets POS vendors and third-party
    integrators provision and manage stores on the Bevz platform programmatically. It covers store
    creation, provisioning and deprovisioning; menu upload in CSV or JSON with configurable column
    mapping and asynchronous status tracking; menu synchronization out to the connected delivery
    services; product catalog maintenance with per-service pricing and availability; the full order
    lifecycle from receipt through acceptance, out-for-delivery, completion, rejection and
    cancellation; post-acceptance order adjustments; and delivery-service onboarding for DoorDash and
    Grubhub via a single call plus a dedicated three-step OAuth handshake for Uber Eats. Three
    outbound webhooks push order events, menu upload status and store settings changes. Authentication
    is a bearer JWT with a 30-day lifetime, minted from Bevz-issued integrator credentials.
  humanURL: https://docs.bevz.com/
  baseURL: https://api.bevz.com/integrator-service
